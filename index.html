        modalAddTitle: 'Add New Book Record',
        modalEditTitle: 'Edit Book Record',
        modalDetailTitle: 'Book Record Details',
        btnSave: 'Save Record',
        btnCancel: 'Cancel',
        btnClose: 'Close',
        importTitle: 'Bulk CSV / Excel Book Import',
        importSubtitle: 'Upload .csv or .xlsx files with complete UTF-8 character preservation.',
        importDropzoneText: '📁 Upload CSV or Excel (.xlsx / .xls) file here',
        importDropzoneHint: 'Click or drag and drop file',
        btnDownloadTemplate: '📥 Download Sample Excel Template',
        importPreviewTitle: 'Data Preview & Inline Correction',
        importReadyRecords: '✓ Ready',
        importInvalidWarning: '⚠️ Needs Correction',
        btnExecuteImport: 'Save Valid Books to Database',
        importSuccessSummary: '✅ Import process completed successfully!',
        importFailCount: '❌ Skipped/Invalid Rows:',
        importSuccessCount: 'Successfully Saved Books:',
        headerMapTitle: 'Book Title',
        headerMapAuthor: 'Author',
        headerMapSerial: 'Serial No.',
        headerMapCat: 'Catalogue No.',
        headerMapSection: 'Section',
        headerMapPage: 'Source Page',
        loginTitle: 'Ummul Qura Library - Admin Login',
        loginPassLabel: 'Enter Admin Password:',
        loginBtn: 'Login',
        loginError: 'Incorrect password! Please try again.',
        logoutBtn: 'Logout',
        confirmDelete: 'Are you sure you want to delete this book record?',
        dupWarningDb: 'Duplicate Catalogue Number (Exists in Database)',
        dupWarningFile: 'Duplicate Catalogue Number (Repeated in Uploaded File)',
        missingCatWarning: 'Missing Catalogue Number',
        missingTitleWarning: 'Missing Book Title',
        footerText: '© 2026 Ummul Qura Library (مكتبة أم القرى) - All rights reserved.'
      }
    };

    const HEADER_ALIASES = {
      title: ['title', 'book title', 'اسم الكتاب', 'کتاب کا نام', 'عنوان'],
      author: ['author', 'المؤلف', 'مصنف'],
      serial_number: ['serial number', 'serial_number', 'serial', 'الرقم التسلسلي', 'سلسلہ نمبر'],
      catalogue_number: ['catalogue number', 'catalogue_number', 'catalogue', 'رقم الفهرس', 'فہرست نمبر'],
      alphabetical_section: ['alphabetical section', 'alphabetical_section', 'section', 'القسم الأبجدي', 'حرف', 'شعبہ'],
      source_page: ['source page', 'source_page', 'page', 'رقم الصفحة', 'صفحہ نمبر', 'المصدر']
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('uql_app_lang') || 'ur');
      const [books, setBooks] = useState(() => {
        const saved = localStorage.getItem('uql_books_db');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return INITIAL_50_BOOKS;
      });

      const [activeTab, setActiveTab] = useState('catalogue');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSection, setSelectedSection] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [loginPassword, setLoginPassword] = useState('');
      const [loginErrorMsg, setLoginErrorMsg] = useState('');
      const [showImportModal, setShowImportModal] = useState(false);
      const [showAddEditModal, setShowAddEditModal] = useState(false);
      const [editingBook, setEditingBook] = useState(null);
      const [viewingBook, setViewingBook] = useState(null);
      const [toast, setToast] = useState(null);

      const t = UI_TRANSLATIONS[lang];

      useEffect(() => {
        localStorage.setItem('uql_books_db', JSON.stringify(books));
      }, [books]);

      useEffect(() => {
        localStorage.setItem('uql_app_lang', lang);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      }, [lang]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const toggleLanguage = () => {
        setLang(prev => prev === 'ur' ? 'en' : 'ur');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (loginPassword === 'admin123' || loginPassword === '1234') {
          setIsAdminLoggedIn(true);
          setLoginErrorMsg('');
          setLoginPassword('');
          showToast(lang === 'ur' ? 'ایڈمن سیشن کامیابی سے شروع ہوا' : 'Admin session authenticated');
        } else {
          setLoginErrorMsg(t.loginError);
        }
      };

      const alphabeticalSections = useMemo(() => {
        const secSet = new Set(books.map(b => b.alphabetical_section).filter(Boolean));
        return Array.from(secSet).sort();
      }, [books]);

      const categories = useMemo(() => {
        const catSet = new Set(books.map(b => b.category).filter(Boolean));
        return Array.from(catSet).sort();
      }, [books]);

      const filteredBooks = useMemo(() => {
        return books.filter(book => {
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || 
            (book.title && book.title.toLowerCase().includes(q)) ||
            (book.author && book.author.toLowerCase().includes(q)) ||
            (book.catalogue_number && book.catalogue_number.toLowerCase().includes(q)) ||
            (book.serial_number && book.serial_number.toLowerCase().includes(q));

          const matchesSection = selectedSection === 'ALL' || book.alphabetical_section === selectedSection;
          const matchesCategory = selectedCategory === 'ALL' || book.category === selectedCategory;

          return matchesSearch && matchesSection && matchesCategory;
        });
      }, [books, searchQuery, selectedSection, selectedCategory]);

      const handleSaveBook = (bookData) => {
        if (editingBook) {
          setBooks(prev => prev.map(b => b.id === editingBook.id ? { ...b, ...bookData } : b));
          showToast(lang === 'ur' ? 'کتاب کی تفصیلات اپ ڈیٹ کر دی گئیں' : 'Book updated successfully');
        } else {
          const newBook = { id: Date.now().toString(), ...bookData };
          setBooks(prev => [newBook, ...prev]);
          showToast(lang === 'ur' ? 'نئی کتاب کامیابی سے شامل کی گئی' : 'New book added successfully');
        }
        setShowAddEditModal(false);
        setEditingBook(null);
      };

      const handleDeleteBook = (id) => {
        if (window.confirm(t.confirmDelete)) {
          setBooks(prev => prev.filter(b => b.id !== id));
          showToast(lang === 'ur' ? 'کتاب ریکارڈ سے حذف کر دی گئی' : 'Book record deleted', 'info');
        }
      };

      const handleSaveImportedBooks = (newBooks) => {
        setBooks(prev => [...newBooks, ...prev]);
        showToast(
          lang === 'ur' 
            ? `${newBooks.length} کتب اُمّ القریٰ لائبریری میں شامل کر دی گئیں` 
            : `${newBooks.length} books imported into Ummul Qura Library`
        );
      };

      return (
        <div className={`min-h-screen flex flex-col ${lang === 'ur' ? 'font-urdu' : 'font-en'}`}>
          <header className="bg-emerald-900 text-amber-50 shadow-lg border-b border-emerald-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-3 rtl:space-x-reverse">
                <div className="w-12 h-12 rounded-full bg-amber-500 text-emerald-950 flex items-center justify-center text-2xl font-bold shadow">
                  🏛️
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold tracking-wide leading-tight">
                    {lang === 'ur' ? 'اُمّ القریٰ لائبریری' : 'Ummul Qura Library'}
                  </h1>
                  <p className="text-xs text-amber-200 opacity-90 font-arabic">
                    مكتبة أم القرى | {t.appNameEn}
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-2 sm:space-x-4 rtl:space-x-reverse">
                <nav className="flex bg-emerald-950/60 p-1 rounded-lg border border-emerald-700/50">
                  <button
                    onClick={() => setActiveTab('catalogue')}
                    className={`px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold transition ${
                      activeTab === 'catalogue' 
                        ? 'bg-amber-500 text-emerald-950 shadow' 
                        : 'text-amber-100 hover:text-white hover:bg-emerald-800/50'
                    }`}
                  >
                    📖 {t.navCatalogue}
                  </button>
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold transition ${
                      activeTab === 'admin' 
                        ? 'bg-amber-500 text-emerald-950 shadow' 
                        : 'text-amber-100 hover:text-white hover:bg-emerald-800/50'
                    }`}
                  >
                    ⚙️ {t.navAdmin}
                  </button>
                </nav>

                <button
                  onClick={toggleLanguage}
                  className="bg-amber-400 hover:bg-amber-300 text-emerald-950 px-3 py-1.5 rounded-md text-sm font-bold flex items-center space-x-1 rtl:space-x-reverse shadow transition transform active:scale-95"
                >
                  <span>🌐</span>
                  <span>{t.langSwitchBtn}</span>
                </button>
              </div>
            </div>
          </header>

          {toast && (
            <div className={`fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-xl text-white text-sm font-bold transition-all ${
              toast.type === 'info' ? 'bg-amber-600' : 'bg-emerald-700'
            }`}>
              {toast.message}
            </div>
          )}

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === 'catalogue' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-emerald-800 to-teal-900 rounded-2xl p-6 sm:p-8 text-white shadow-md border border-emerald-700">
                  <h2 className="text-2xl sm:text-3xl font-bold mb-2">
                    {t.heroTitle}
                  </h2>
                  <p className="text-emerald-100 text-sm sm:text-base max-w-3xl">
                    {t.heroSubtitle}
                  </p>
                  
                  <div className="grid grid-cols-3 gap-3 sm:gap-6 mt-6 pt-6 border-t border-emerald-700/60">
                    <div className="bg-emerald-950/40 backdrop-blur-sm p-3 rounded-xl border border-emerald-600/30 text-center">
                      <div className="text-xl sm:text-3xl font-extrabold text-amber-400">{books.length}</div>
                      <div className="text-xs text-emerald-200 mt-1">{t.statsTotal}</div>
                    </div>
                    <div className="bg-emerald-950/40 backdrop-blur-sm p-3 rounded-xl border border-emerald-600/30 text-center">
                      <div className="text-xl sm:text-3xl font-extrabold text-amber-400">{categories.length}</div>
                      <div className="text-xs text-emerald-200 mt-1">{t.statsCategories}</div>
                    </div>
                    <div className="bg-emerald-950/40 backdrop-blur-sm p-3 rounded-xl border border-emerald-600/30 text-center">
                      <div className="text-xl sm:text-3xl font-extrabold text-amber-400">{alphabeticalSections.length}</div>
                      <div className="text-xs text-emerald-200 mt-1">{t.statsSections}</div>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                    <div className="md:col-span-6 relative">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder={t.searchPlaceholder}
                        className="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm"
                      />
                      <span className="absolute inset-y-0 ltr:right-3 rtl:left-3 flex items-center pointer-events-none text-slate-400">
                        🔍
                      </span>
                    </div>

                    <div className="md:col-span-3">
                      <select
                        value={selectedSection}
                        onChange={(e) => setSelectedSection(e.target.value)}
                        className="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 text-sm font-semibold"
                      >
                        <option value="ALL">{t.filterAllSections}</option>
                        {alphabeticalSections.map(sec => (
                          <option key={sec} value={sec}>القسم: {sec}</option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-3">
                      <select
                        value={selectedCategory}
                        onChange={(e) => setSelectedCategory(e.target.value)}
                        className="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 text-sm font-semibold"
                      >
                        <option value="ALL">{t.filterAllCategories}</option>
                        {categories.map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-right rtl:text-right ltr:text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100/80 border-b border-slate-200 text-slate-700 text-xs sm:text-sm uppercase font-bold">
                          <th className="py-3.5 px-4">{t.tableHeaderCatNo}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderTitle}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderAuthor}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderSerial}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderSection}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderPage}</th>
                          <th className="py-3.5 px-4">{t.tableHeaderActions}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-sm">
                        {filteredBooks.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="text-center py-12 text-slate-500">
                              {lang === 'ur' ? 'کوئی کتاب دستیاب نہیں ہے یا تلاش کے مطابق نہیں ملی۔' : 'No books found matching your query.'}
                            </td>
                          </tr>
                        ) : (
                          filteredBooks.map((book) => (
                            <tr key={book.id} className="hover:bg-emerald-50/40 transition">
                              <td className="py-3 px-4 font-mono font-semibold text-emerald-800 text-xs sm:text-sm">
                                {book.catalogue_number}
                              </td>
                              <td className="py-3 px-4 font-bold text-slate-900 text-base font-arabic">
                                {book.title}
                              </td>
                              <td className="py-3 px-4 text-slate-700 font-arabic">
                                {book.author}
                              </td>
                              <td className="py-3 px-4 font-mono text-slate-600 text-xs">
                                {book.serial_number || '-'}
                              </td>
                              <td className="py-3 px-4">
                                <span className="inline-block bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-full text-xs">
                                  {book.alphabetical_section || '-'}
                                </span>
                              </td>
                              <td className="py-3 px-4 text-slate-600 text-xs">
                                {book.source_page || '-'}
                              </td>
                              <td className="py-3 px-4">
                                <button
                                  onClick={() => setViewingBook(book)}
                                  className="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold px-3 py-1.5 rounded-lg transition"
                                >
                                  👁️ {t.btnViewDetails}
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'admin' && (
              <div className="space-y-6">
                {!isAdminLoggedIn ? (
                  <div className="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-200 mt-8 text-center space-y-4">
                    <div className="w-16 h-16 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center mx-auto text-3xl">
                      🔐
                    </div>
                    <h3 className="text-xl font-bold text-slate-900">{t.loginTitle}</h3>
                    <p className="text-xs text-slate-500">
                      (Password: <code className="bg-slate-100 px-1 py-0.5 rounded">admin123</code>)
                    </p>

                    <form onSubmit={handleAdminLogin} className="space-y-4 text-right rtl:text-right ltr:text-left mt-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">
                          {t.loginPassLabel}
                        </label>
                        <input
                          type="password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                          placeholder="••••••••"
                        />
                      </div>
                      {loginErrorMsg && (
                        <p className="text-xs text-rose-600 font-semibold">{loginErrorMsg}</p>
                      )}
                      <button
                        type="submit"
                        className="w-full bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow text-sm transition"
                      >
                        {t.loginBtn}
                      </button>
                    </form>
                  </div>
                ) : (
                  <>
                    <div className="bg-emerald-950 text-white rounded-2xl p-6 shadow-md border border-emerald-900 flex flex-col md:flex-row justify-between items-center gap-4">
                      <div>
                        <h2 className="text-2xl font-bold text-amber-400">
                          ⚙️ {lang === 'ur' ? 'اُمّ القریٰ لائبریری - ایڈمن کنٹرول' : 'Ummul Qura Library - Admin Control'}
                        </h2>
                        <p className="text-xs text-emerald-200 mt-1">
                          {lang === 'ur' 
                            ? 'کتب کی انفرادی شمولیت، بلک یکمشت اپلوڈ، ڈیٹا بیس ترمیم اور ریکارڈ کی حذف کاری' 
                            : 'Manage library entries, perform bulk CSV/Excel imports, and update records'}
                        </p>
                      </div>

                      <div className="flex flex-wrap items-center gap-3">
                        <button
                          onClick={() => { setEditingBook(null); setShowAddEditModal(true); }}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow flex items-center space-x-2 rtl:space-x-reverse transition"
                        >
                          <span>{t.btnAddBook}</span>
                        </button>

                        <button
                          onClick={() => setShowImportModal(true)}
                          className="bg-amber-500 hover:bg-amber-400 text-emerald-950 font-extrabold px-4 py-2.5 rounded-xl text-sm shadow-lg border border-amber-300 flex items-center space-x-2 rtl:space-x-reverse transition transform active:scale-95"
                        >
                          <span>{t.btnBulkImport}</span>
                        </button>

                        <button
                          onClick={() => setIsAdminLoggedIn(false)}
                          className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-2.5 rounded-xl text-xs transition"
                        >
                          🚪 {t.logoutBtn}
                        </button>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <h3 className="font-bold text-slate-800 text-base">
                          {lang === 'ur' ? 'ڈیٹا بیس کی تمام کتب' : 'All Database Books'} ({books.length})
                        </h3>
                        <span className="text-xs text-emerald-800 font-semibold bg-emerald-100 px-3 py-1 rounded-full">
                          {lang === 'ur' ? 'محفوظ شدا ریکارڈر' : 'Persistent Storage Active'}
                        </span>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-right rtl:text-right ltr:text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs uppercase font-bold">
                              <th className="py-3 px-4">{t.tableHeaderCatNo}</th>
                              <th className="py-3 px-4">{t.tableHeaderTitle}</th>
                              <th className="py-3 px-4">{t.tableHeaderAuthor}</th>
                              <th className="py-3 px-4">{t.tableHeaderSerial}</th>
                              <th className="py-3 px-4">{t.tableHeaderSection}</th>
                              <th className="py-3 px-4">{t.tableHeaderPage}</th>
                              <th className="py-3 px-4 text-center">{t.tableHeaderActions}</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200 text-sm">
                            {books.map((book) => (
                              <tr key={book.id} className="hover:bg-slate-50 transition">
                                <td className="py-3 px-4 font-mono font-bold text-emerald-800 text-xs">
                                  {book.catalogue_number}
                                </td>
                                <td className="py-3 px-4 font-bold text-slate-900 font-arabic">
                                  {book.title}
                                </td>
                                <td className="py-3 px-4 text-slate-700 font-arabic text-xs">
                                  {book.author}
                                </td>
                                <td className="py-3 px-4 font-mono text-slate-500 text-xs">
                                  {book.serial_number || '-'}
                                </td>
                                <td className="py-3 px-4 text-xs font-bold text-amber-900">
                                  {book.alphabetical_section || '-'}
                                </td>
                                <td className="py-3 px-4 text-slate-500 text-xs">
                                  {book.source_page || '-'}
                                </td>
                                <td className="py-3 px-4 text-center space-x-1 rtl:space-x-reverse">
                                  <button
                                    onClick={() => { setEditingBook(book); setShowAddEditModal(true); }}
                                    className="bg-blue-100 hover:bg-blue-200 text-blue-900 text-xs px-2.5 py-1 rounded font-bold"
                                  >
                                    ✏️ {t.btnEdit}
                                  </button>
                                  <button
                                    onClick={() => handleDeleteBook(book.id)}
                                    className="bg-rose-100 hover:bg-rose-200 text-rose-900 text-xs px-2.5 py-1 rounded font-bold"
                                  >
                                    🗑️ {t.btnDelete}
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}
          </main>

          {showImportModal && (
            <BulkImporterModal
              existingBooks={books}
              onSave={handleSaveImportedBooks}
              onClose={() => setShowImportModal(false)}
              t={t}
              lang={lang}
            />
          )}

          {showAddEditModal && (
            <AddEditBookModal
              book={editingBook}
              onSave={handleSaveBook}
              onClose={() => { setShowAddEditModal(false); setEditingBook(null); }}
              t={t}
              lang={lang}
            />
          )}

          {viewingBook && (
            <ViewBookDetailsModal
              book={viewingBook}
              onClose={() => setViewingBook(null)}
              t={t}
              lang={lang}
            />
          )}

          <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
            <div className="max-w-7xl mx-auto px-4">
              <p className="font-semibold text-slate-300">{t.footerText}</p>
              <p className="text-slate-500 text-[11px] mt-1 font-arabic">
                مكتبة أم القرى - نظام الفهرسة الرقمي بلغة اردو والإنجليزية
              </p>
            </div>
          </footer>
        </div>
      );
    }

    function BulkImporterModal({ existingBooks, onSave, onClose, t, lang }) {
      const [parsedData, setParsedData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [importSummary, setImportSummary] = useState(null);
      const fileInputRef = useRef(null);

      const existingCatNumbers = useMemo(() => {
        return new Set(existingBooks.map(b => String(b.catalogue_number || '').trim()));
      }, [existingBooks]);

      const mapRawRowToSchema = (rawRow) => {
        const row = {};
        const keys = Object.keys(rawRow);

        Object.keys(HEADER_ALIASES).forEach((standardKey) => {
          const matchKey = keys.find(k => 
            HEADER_ALIASES[standardKey].includes(String(k).trim().toLowerCase())
          );
          row[standardKey] = matchKey ? String(rawRow[matchKey]).trim() : '';
        });

        row.category = rawRow.category || rawRow. زمرہ || rawRow.التصنيف || 'عام';
        return row;
      };

      const processFile = (file) => {
        if (!file) return;
        setFileName(file.name);
        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            const fileCatNumbers = new Set();
            const processed = rawRows.map((rawRow, idx) => {
              const item = mapRawRowToSchema(rawRow);
              const catNum = String(item.catalogue_number || '').trim();

              let isDuplicate = false;
              let warningMessage = '';

              if (!catNum) {
                warningMessage = t.missingCatWarning;
              } else if (!item.title) {
                warningMessage = t.missingTitleWarning;
              } else if (existingCatNumbers.has(catNum)) {
                isDuplicate = true;
                warningMessage = t.dupWarningDb;
              } else if (fileCatNumbers.has(catNum)) {
                isDuplicate = true;
                warningMessage = t.dupWarningFile;
              } else {
                fileCatNumbers.add(catNum);
              }

              return {
                id: `import-row-${idx}`,
                ...item,
                isDuplicate,
                warningMessage,
                isValid: Boolean(item.title && catNum && !isDuplicate)
              };
            });

            setParsedData(processed);
            setImportSummary(null);
          } catch(err) {
            alert('File error: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleCellEdit = (index, field, value) => {
        const updated = [...parsedData];
        updated[index][field] = value;
        const catNum = String(updated[index].catalogue_number || '').trim();
        const isDup = existingCatNumbers.has(catNum);
        
        updated[index].isDuplicate = isDup;
        updated[index].warningMessage = !catNum ? t.missingCatWarning : !updated[index].title ? t.missingTitleWarning : isDup ? t.dupWarningDb : '';
        updated[index].isValid = Boolean(updated[index].title && catNum && !isDup);
        setParsedData(updated);
      };

      const handleExecuteSave = () => {
        const validRecords = parsedData.filter(r => r.isValid);
        const failedCount = parsedData.length - validRecords.length;

        if (validRecords.length === 0) {
          alert(lang === 'ur' ? 'درآمد کرنے کے لیے کوئی درست کتاب نہیں ہے۔' : 'No valid records to import.');
          return;
        }

        const cleanBooks = validRecords.map(({ id, isDuplicate, warningMessage, isValid, ...rest }) => ({
          id: 'imp-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
          ...rest
        }));

        onSave(cleanBooks);
        setImportSummary({ success: validRecords.length, failed: failedCount });
        setParsedData([]);
      };

      const handleDownloadTemplate = () => {
        const sampleData = [
          { "فہرست نمبر": "UQL-2001", "کتاب کا نام": "جامع الترمذي (نمونہ)", "مصنف": "الإمام الترمذي", "سلسلہ نمبر": "SN-2001", "القسم الأبجدي": "ج", "صفحہ نمبر": "1-300", "زمرہ": "الحديث الشريف" },
          { "فہرست نمبر": "UQL-2002", "کتاب کا نام": "تفسیر الجلالین (نمونہ)", "مصنف": "جلال الدين المحلي والسيوطي", "سلسلہ نمبر": "SN-2002", "القسم الأبجدي": "ت", "صفحہ نمبر": "1-500", "زمرہ": "تفسير القرآن" }
        ];
        const ws = XLSX.utils.json_to_sheet(sampleData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template");
        XLSX.writeFile(wb, "اُمّ القریٰ لائبریری - کتابوں کی فہرست.xlsx");
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full p-6 space-y-6 max-h-[90vh] flex flex-col text-right rtl:text-right ltr:text-left">
            <div className="flex justify-between items-center border-b pb-4 border-slate-200">
              <div>
                <h3 className="text-xl font-bold text-slate-900">{t.importTitle}</h3>
                <p className="text-xs text-slate-500 mt-1">{t.importSubtitle}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold px-2 py-1">✕</button>
            </div>

            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <button onClick={handleDownloadTemplate} className="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-bold px-4 py-2 rounded-xl text-xs">
                  {t.btnDownloadTemplate}
                </button>
                {fileName && <span className="text-xs font-semibold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-md border border-emerald-200">📄 {fileName}</span>}
              </div>

              <div onClick={() => fileInputRef.current.click()} className="border-2 border-dashed border-emerald-600/40 bg-emerald-50/50 hover:bg-emerald-50 rounded-2xl p-6 text-center cursor-pointer">
                <input type="file" ref={fileInputRef} onChange={(e) => processFile(e.target.files[0])} accept=".csv, .xlsx, .xls" className="hidden" />
                <div className="text-3xl mb-2">📂</div>
                <h4 className="font-bold text-emerald-950 text-base">{t.importDropzoneText}</h4>
                <p className="text-xs text-slate-500 mt-1">{t.importDropzoneHint}</p>
              </div>
            </div>

            {importSummary && (
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl space-y-1">
                <h4 className="font-bold text-emerald-900 text-sm">{t.importSuccessSummary}</h4>
                <p className="text-xs text-emerald-800">
                  {t.importSuccessCount} <strong>{importSummary.success}</strong> | {t.importFailCount} <strong>{importSummary.failed}</strong>
                </p>
              </div>
            )}

            {parsedData.length > 0 && (
              <div className="flex-grow overflow-hidden flex flex-col space-y-3">
                <div className="flex justify-between items-center">
                  <h4 className="font-bold text-slate-800 text-sm">{t.importPreviewTitle} ({parsedData.length} records)</h4>
                  <button onClick={handleExecuteSave} className="bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">
                    💾 {t.btnExecuteImport}
                  </button>
                </div>

                <div className="overflow-x-auto overflow-y-auto max-h-64 border border-slate-200 rounded-xl">
                  <table className="w-full text-right rtl:text-right ltr:text-left text-xs border-collapse">
                    <thead className="sticky top-0 bg-slate-100 font-bold text-slate-700 border-b">
                      <tr>
                        <th className="p-2.5">Status</th>
                        <th className="p-2.5">{t.headerMapCat}</th>
                        <th className="p-2.5">{t.headerMapTitle}</th>
                        <th className="p-2.5">{t.headerMapAuthor}</th>
                        <th className="p-2.5">{t.headerMapSerial}</th>
                        <th className="p-2.5">{t.headerMapSection}</th>
                        <th className="p-2.5">{t.headerMapPage}</th>
                        <th className="p-2.5 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {parsedData.map((row, idx) => (
                        <tr key={row.id} className={row.isDuplicate ? 'bg-rose-50' : !row.isValid ? 'bg-amber-50' : 'bg-white'}>
                          <td className="p-2 font-semibold">
                            {row.isValid ? <span className="text-emerald-700 font-bold">{t.importReadyRecords}</span> : <span className="text-rose-600 font-bold text-[11px]">{row.warningMessage}</span>}
                          </td>
                          <td className="p-1"><input type="text" value={row.catalogue_number} onChange={(e) => handleCellEdit(idx, 'catalogue_number', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded font-mono text-xs" /></td>
                          <td className="p-1"><input type="text" value={row.title} onChange={(e) => handleCellEdit(idx, 'title', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded font-arabic text-xs" /></td>
                          <td className="p-1"><input type="text" value={row.author} onChange={(e) => handleCellEdit(idx, 'author', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded font-arabic text-xs" /></td>
                          <td className="p-1"><input type="text" value={row.serial_number} onChange={(e) => handleCellEdit(idx, 'serial_number', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded text-xs" /></td>
                          <td className="p-1"><input type="text" value={row.alphabetical_section} onChange={(e) => handleCellEdit(idx, 'alphabetical_section', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded text-xs" /></td>
                          <td className="p-1"><input type="text" value={row.source_page} onChange={(e) => handleCellEdit(idx, 'source_page', e.target.value)} className="w-full px-2 py-1 bg-white border border-slate-300 rounded text-xs" /></td>
                          <td className="p-1 text-center">
                            <button onClick={() => setParsedData(prev => prev.filter((_, i) => i !== idx))} className="bg-rose-600 text-white px-2 py-1 rounded text-[11px]">🗑️</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            <div className="flex justify-end pt-3 border-t border-slate-200">
              <button onClick={onClose} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-xl text-xs">{t.btnClose}</button>
            </div>
          </div>
        </div>
      );
    }

    function AddEditBookModal({ book, onSave, onClose, t, lang }) {
      const [formData, setFormData] = useState({
        catalogue_number: book?.catalogue_number || '',
        title: book?.title || '',
        author: book?.author || '',
        serial_number: book?.serial_number || '',
        alphabetical_section: book?.alphabetical_section || '',
        source_page: book?.source_page || '',
        category: book?.category || 'الحديث الشريف'
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.catalogue_number) {
          alert(lang === 'ur' ? 'براہ کرم کتاب کا نام اور فہرست نمبر لازمی درج کریں' : 'Please provide title & catalogue number');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 text-right rtl:text-right ltr:text-left space-y-4">
            <h3 className="text-xl font-bold text-slate-900 border-b pb-3 border-slate-200">
              {book ? t.modalEditTitle : t.modalAddTitle}
            </h3>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderCatNo} *</label>
                <input type="text" required value={formData.catalogue_number} onChange={(e) => setFormData({ ...formData, catalogue_number: e.target.value })} placeholder="e.g. UQL-1051" className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderTitle} *</label>
                <input type="text" required value={formData.title} onChange={(e) => setFormData({ ...formData, title: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-arabic" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderAuthor}</label>
                <input type="text" value={formData.author} onChange={(e) => setFormData({ ...formData, author: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-arabic" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderSerial}</label>
                  <input type="text" value={formData.serial_number} onChange={(e) => setFormData({ ...formData, serial_number: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderSection}</label>
                  <input type="text" value={formData.alphabetical_section} onChange={(e) => setFormData({ ...formData, alphabetical_section: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderPage}</label>
                  <input type="text" value={formData.source_page} onChange={(e) => setFormData({ ...formData, source_page: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">{t.tableHeaderCategory}</label>
                  <input type="text" value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm" />
                </div>
              </div>
              <div className="flex justify-end space-x-2 rtl:space-x-reverse pt-4 border-t border-slate-200">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 text-slate-800 rounded-xl font-bold text-xs">{t.btnCancel}</button>
                <button type="submit" className="px-4 py-2 bg-emerald-800 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow">{t.btnSave}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ViewBookDetailsModal({ book, onClose, t, lang }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-right rtl:text-right ltr:text-left space-y-4">
            <div className="flex justify-between items-center border-b pb-3 border-slate-200">
              <h3 className="text-lg font-bold text-slate-900">{t.modalDetailTitle}</h3>
              <span className="bg-emerald-100 text-emerald-900 font-mono font-bold text-xs px-2.5 py-1 rounded-full">{book.catalogue_number}</span>
            </div>
            <div className="space-y-3 font-arabic">
              <div>
                <span className="text-xs font-bold text-slate-500 block">{t.tableHeaderTitle}</span>
                <p className="text-xl font-bold text-emerald-950 mt-0.5">{book.title}</p>
              </div>
              <div>
                <span className="text-xs font-bold text-slate-500 block">{t.tableHeaderAuthor}</span>
                <p className="text-base font-semibold text-slate-800 mt-0.5">{book.author}</p>
              </div>
              <div className="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 text-xs">
                <div><span className="font-bold text-slate-500 block">{t.tableHeaderSerial}</span><p className="font-mono text-slate-800">{book.serial_number || '-'}</p></div>
                <div><span className="font-bold text-slate-500 block">{t.tableHeaderSection}</span><p className="font-bold text-amber-900">{book.alphabetical_section || '-'}</p></div>
              </div>
            </div>
            <div className="flex justify-end pt-4 border-t border-slate-200">
              <button onClick={onClose} className="px-4 py-2 bg-emerald-800 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow">{t.btnClose}</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
