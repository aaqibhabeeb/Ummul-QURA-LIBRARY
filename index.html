    // Main App Component
    function App() {
      const [books, setBooks] = useState([]);
      const [activeTab, setActiveTab] = useState('catalog'); // 'catalog' | 'admin'
      const [lang, setLang] = useState('ur'); // 'ur' | 'en'
      const [toast, setToast] = useState(null);
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showAddModal, setShowAddModal] = useState(false);
      const [editingBook, setEditingBook] = useState(null);
      const [selectedDetailBook, setSelectedDetailBook] = useState(null);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      // Initialize App State & Persistent Storage
      useEffect(() => {
        // Load Language Preference
        const savedLang = localStorage.getItem('uql_app_lang');
        if (savedLang === 'en' || savedLang === 'ur') {
          setLang(savedLang);
        } else {
          setLang('ur');
        }

        // Load Catalog Books
        try {
          const stored = localStorage.getItem('uql_books_db');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setBooks(parsed);
              return;
            }
          }
        } catch (e) {
          console.error('LocalStorage read error:', e);
        }

        // Default setup if no localStorage
        setBooks(INITIAL_50_BOOKS);
        localStorage.setItem('uql_books_db', JSON.stringify(INITIAL_50_BOOKS));
      }, []);

      // Toggle Language Handler
      const toggleLanguage = () => {
        const nextLang = lang === 'ur' ? 'en' : 'ur';
        setLang(nextLang);
        localStorage.setItem('uql_app_lang', nextLang);
      };

      // Set HTML dir and lang attributes dynamically
      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
      }, [lang]);

      const t = (key) => UI_DICTIONARY[lang][key] || key;

      // Handle Tab Switch (Guard Admin View)
      const handleTabSwitch = (tab) => {
        if (tab === 'admin' && !isAdminLoggedIn) {
          setShowLoginModal(true);
        } else {
          setActiveTab(tab);
        }
      };

      // Update State & LocalStorage Helper
      const updateBooksStateAndStorage = (newList) => {
        setBooks(newList);
        localStorage.setItem('uql_books_db', JSON.stringify(newList));
      };

      // Toast Notification Helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Save or Edit Book
      const handleSaveBook = (bookData) => {
        if (editingBook) {
          const updated = books.map(b => b.id === editingBook.id ? { ...b, ...bookData } : b);
          updateBooksStateAndStorage(updated);
          showToast(t('toastUpdateSuccess'));
        } else {
          const newBook = {
            id: 'b_' + Date.now(),
            ...bookData
          };
          updateBooksStateAndStorage([newBook, ...books]);
          showToast(t('toastAddSuccess'));
        }
        setShowAddModal(false);
        setEditingBook(null);
      };

      // Delete Book
      const handleDeleteBook = (id) => {
        const updated = books.filter(b => b.id !== id);
        updateBooksStateAndStorage(updated);
        setConfirmDeleteId(null);
        showToast(t('toastDeleteSuccess'), 'warning');
      };

      // Reset Database
      const handleResetDatabase = () => {
        updateBooksStateAndStorage(INITIAL_50_BOOKS);
        showToast(t('toastResetSuccess'));
      };

      // Save Bulk Imported Records
      const handleBulkImportSave = (cleanRecords) => {
        const newEntries = cleanRecords.map((item, idx) => ({
          id: 'imp_' + Date.now() + '_' + idx,
          catalogue_number: item.catalogue_number || `UQL-IMP-${1000 + idx}`,
          title: item.title || '€Ì— ⁄‰Ê«‰ ‘œ¿',
          author: item.author || '€Ì— „⁄—Ê› „’‰›',
          serial_number: item.serial_number || `SN-IMP-${100 + idx}`,
          alphabetical_section: item.alphabetical_section || '√',
          category: item.category || '⁄«„  «·Ì›',
          source_page: item.source_page || '’ 1',
          total_copies: parseInt(item.total_copies) || 5,
          available_copies: parseInt(item.available_copies) || 5
        }));

        const combined = [...newEntries, ...books];
        updateBooksStateAndStorage(combined);
        showToast(t('toastImportSuccess'), 'success');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* HEADER */}
          <header className="bg-library-900 text-white shadow-xl border-b-2 border-gold-500 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
              
              {/* Logo & Correct Library Name */}
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-gold-400 to-gold-500 flex items-center justify-center text-library-950 font-bold text-2xl shadow-md border border-gold-300">
                  <i className="fa-solid fa-book-bookmark"></i>
                </div>
                <div>
                  <h1 className="text-2xl font-bold font-arabic-title text-gold-300 tracking-wide flex items-center gap-2">
                    {t('appTitle')}
                  </h1>
                  <p className="text-xs text-library-100">{t('appSubtitle')}</p>
                </div>
              </div>

              {/* Tabs & Controls */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-library-950 p-1.5 rounded-xl border border-library-800">
                  <button
                    onClick={() => handleTabSwitch('catalog')}
                    className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-bold transition flex items-center gap-2 ${
                      activeTab === 'catalog'
                        ? 'bg-gold-500 text-library-950 shadow-md'
                        : 'text-library-100 hover:text-white hover:bg-library-800/60'
                    }`}
                  >
                    <i className="fa-solid fa-book-open"></i>
                    <span>{t('publicCatalogTab')}</span>
                  </button>

                  <button
                    onClick={() => handleTabSwitch('admin')}
                    className={`px-4 py-2 rounded-lg text-xs sm:text-sm font-bold transition flex items-center gap-2 ${
                      activeTab === 'admin'
                        ? 'bg-gold-500 text-library-950 shadow-md'
                        : 'text-library-100 hover:text-white hover:bg-library-800/60'
                    }`}
                  >
                    <i className="fa-solid fa-user-shield"></i>
                    <span>{t('adminDashboardTab')}</span>
                    <span className="bg-library-900 text-gold-300 text-xs px-2 py-0.5 rounded-full font-bold">
                      {books.length}
                    </span>
                  </button>
                </div>

                {/* Admin Logout Button */}
                {isAdminLoggedIn && (
                  <button
                    onClick={() => { setIsAdminLoggedIn(false); setActiveTab('catalog'); }}
                    className="bg-red-700 hover:bg-red-600 text-white font-bold px-3 py-2 rounded-xl text-xs shadow transition flex items-center gap-1.5"
                    title={t('adminLogout')}
                  >
                    <i className="fa-solid fa-right-from-bracket"></i>
                    <span className="hidden sm:inline">{t('adminLogout')}</span>
                  </button>
                )}

                {/* LANGUAGE SWITCHER BUTTON */}
                <button
                  onClick={toggleLanguage}
                  className="bg-gold-500 hover:bg-gold-400 text-library-950 font-bold px-3.5 py-2.5 rounded-xl text-xs sm:text-sm shadow-md transition flex items-center gap-2 border border-gold-300"
                  title="Toggle Language / “»«‰ „‰ Œ» ò—Ìü"
                >
                  <i className="fa-solid fa-globe"></i>
                  <span>{lang === 'ur' ? '?? English' : '?? «—œÊ'}</span>
                </button>
              </div>

            </div>
          </header>

          {/* MAIN CONTENT VIEW */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === 'catalog' ? (
              <PublicCatalog
                books={books}
                onSelectDetail={(b) => setSelectedDetailBook(b)}
                t={t}
              />
            ) : (
              <AdminDashboard
                books={books}
                onOpenImport={() => setShowImportModal(true)}
                onOpenAdd={() => { setEditingBook(null); setShowAddModal(true); }}
                onEditBook={(b) => { setEditingBook(b); setShowAddModal(true); }}
                onDeleteBook={(id) => setConfirmDeleteId(id)}
                onResetDatabase={handleResetDatabase}
                t={t}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-5 border-t border-slate-800 text-center mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>{t('footerCopyright')}</p>
              <p className="text-slate-500">{t('footerFeature')}</p>
            </div>
          </footer>

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-5 ${lang === 'ur' ? 'left-5' : 'right-5'} z-50 animate-bounce`}>
              <div className={`px-5 py-3 rounded-xl shadow-2xl text-white font-bold text-sm flex items-center gap-3 border ${
                toast.type === 'warning' ? 'bg-amber-600 border-amber-400' : 'bg-library-800 border-library-600'
              }`}>
                <i className={`fa-solid ${toast.type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {showLoginModal && (
            <AdminLoginModal
              onSuccess={() => {
                setIsAdminLoggedIn(true);
                setShowLoginModal(false);
                setActiveTab('admin');
              }}
              onClose={() => setShowLoginModal(false)}
              t={t}
            />
          )}

          {/* BULK IMPORT MODAL */}
          {showImportModal && (
            <BulkBookImporter
              existingBooks={books}
              onSaveImportedBooks={handleBulkImportSave}
              onClose={() => setShowImportModal(false)}
              t={t}
              lang={lang}
            />
          )}

          {/* ADD / EDIT BOOK MODAL */}
          {showAddModal && (
            <AddEditBookModal
              book={editingBook}
              onSave={handleSaveBook}
              onClose={() => { setShowAddModal(false); setEditingBook(null); }}
              t={t}
            />
          )}

          {/* BOOK DETAIL MODAL */}
          {selectedDetailBook && (
            <BookDetailModal
              book={selectedDetailBook}
              onClose={() => setSelectedDetailBook(null)}
              t={t}
            />
          )}

          {/* DELETE CONFIRMATION MODAL */}
          {confirmDeleteId && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 text-center space-y-4">
                <div className="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 className="text-lg font-bold text-slate-900">{t('confirmDeleteTitle')}</h3>
                <p className="text-slate-600 text-xs leading-relaxed">{t('confirmDeleteMessage')}</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => handleDeleteBook(confirmDeleteId)}
                    className="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition"
                  >
                    {t('confirmDeleteBtn')}
                  </button>
                  <button
                    onClick={() => setConfirmDeleteId(null)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl text-xs transition"
                  >
                    {t('cancelBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // ADMIN LOGIN MODAL
    // =========================================================================
    function AdminLoginModal({ onSuccess, onClose, t }) {
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (password === 'admin123' || password === 'admin') {
          onSuccess();
        } else {
          setErrorMsg(t('invalidPasswordMsg'));
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2 text-library-900 font-bold text-lg">
                <i className="fa-solid fa-user-lock text-gold-500"></i>
                <span>{t('loginModalTitle')}</span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <p className="text-xs text-slate-600">{t('loginModalSubtitle')}</p>

            <form onSubmit={handleLogin} className="space-y-4 pt-1">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">{t('passwordLabel')}</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setErrorMsg(''); }}
                  placeholder={t('passwordPlaceholder')}
                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-gold-500 focus:outline-none"
                />
              </div>

              {errorMsg && (
                <div className="p-3 bg-red-50 text-red-700 border border-red-200 rounded-xl text-xs font-bold">
                  {errorMsg}
                </div>
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs hover:bg-slate-300 transition"
                >
                  {t('cancelBtn')}
                </button>
                <button
                  type="submit"
                  className="px-6 py-2.5 bg-library-800 text-white font-bold rounded-xl text-xs hover:bg-library-900 transition shadow"
                >
                  {t('loginBtn')}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // PUBLIC CATALOGUE COMPONENT
    // =========================================================================
    function PublicCatalog({ books, onSelectDetail, t }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedSection, setSelectedSection] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      const sections = useMemo(() => {
        const set = new Set(books.map(b => b.alphabetical_section).filter(Boolean));
        return ['ALL', ...Array.from(set).sort()];
      }, [books]);

      const categories = useMemo(() => {
        const set = new Set(books.map(b => b.category).filter(Boolean));
        return ['ALL', ...Array.from(set).sort()];
      }, [books]);

      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchSearch =
            (b.title && b.title.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (b.author && b.author.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (b.catalogue_number && b.catalogue_number.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (b.serial_number && b.serial_number.toLowerCase().includes(searchTerm.toLowerCase()));

          const matchSection = selectedSection === 'ALL' || b.alphabetical_section === selectedSection;
          const matchCategory = selectedCategory === 'ALL' || b.category === selectedCategory;

          return matchSearch && matchSection && matchCategory;
        });
      }, [books, searchTerm, selectedSection, selectedCategory]);

      return (
        <div className="space-y-6">
          
          {/* Hero Banner with Search */}
          <div className="bg-gradient-to-r from-library-950 via-slate-900 to-library-950 rounded-2xl p-6 sm:p-8 text-white shadow-xl border border-library-700/50 relative overflow-hidden">
            <div className="relative z-10 max-w-3xl space-y-3">
              <h2 className="text-2xl sm:text-3xl font-bold font-arabic-title text-gold-300">
                {t('searchTitle')}
              </h2>
              <p className="text-library-100 text-xs sm:text-sm leading-relaxed">
                {t('searchSubtitle')}
              </p>

              {/* Search Field */}
              <div className="relative mt-3">
                <i className="fa-solid fa-magnifying-glass absolute ltr:left-4 rtl:right-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
                <input
                  type="text"
                  placeholder={t('searchPlaceholder')}
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full ltr:pl-12 ltr:pr-4 rtl:pr-12 rtl:pl-4 py-3.5 bg-slate-800/90 text-white placeholder-slate-400 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-gold-400 text-xs sm:text-sm shadow-inner"
                />
                {searchTerm && (
                  <button
                    onClick={() => setSearchTerm('')}
                    className="absolute ltr:right-3 rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white px-2 py-1 text-xs"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Section & Category Filters */}
          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500 pb-3 border-b border-slate-100">
              <span className="font-bold text-slate-700 flex items-center gap-1.5">
                <i className="fa-solid fa-filter text-gold-500"></i>
                <span>{t('filtersHeading')}</span>
              </span>
              <span>{t('booksCountLabel')} <strong className="text-library-800 font-bold">{filteredBooks.length}</strong> {t('outOfLabel')} {books.length}</span>
            </div>

            {/* Section Pills */}
            <div className="flex flex-wrap items-center gap-1.5 pt-1">
              <span className="text-xs font-bold text-slate-700 me-2">{t('alphabeticalSectionLabel')}</span>
              {sections.map(sec => (
                <button
                  key={sec}
                  onClick={() => setSelectedSection(sec)}
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                    selectedSection === sec
                      ? 'bg-gold-500 text-library-950 shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {sec === 'ALL' ? t('allSections') : sec}
                </button>
              ))}
            </div>

            {/* Category Pills */}
            {categories.length > 1 && (
              <div className="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-100">
                <span className="text-xs font-bold text-slate-700 me-2">{t('categoryLabel')}</span>
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-0.5 rounded-full text-xs transition ${
                      selectedCategory === cat
                        ? 'bg-library-800 text-gold-300 font-bold'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {cat === 'ALL' ? t('allCategories') : cat}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Book Cards Grid */}
          {filteredBooks.length === 0 ? (
            <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-500 space-y-3">
              <i className="fa-solid fa-book-bookmark text-4xl text-slate-300"></i>
              <p className="font-bold text-slate-700">{t('noBooksFound')}</p>
              <button
                onClick={() => { setSearchTerm(''); setSelectedSection('ALL'); setSelectedCategory('ALL'); }}
                className="text-xs text-library-800 font-bold underline"
              >
                {t('resetFilters')}
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredBooks.map(book => (
                <div
                  key={book.id}
                  className="bg-white rounded-2xl border border-slate-200 hover:border-gold-400 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between group"
                >
                  <div className="space-y-3">
                    
                    {/* Header: Cat No & Section Badge */}
                    <div className="flex items-center justify-between gap-2">
                      <span className="bg-library-50 text-library-900 border border-library-200 font-mono font-bold text-xs px-2.5 py-1 rounded-md">
                        {book.catalogue_number}
                      </span>
                      <span className="bg-gold-100 text-library-950 border border-gold-300 text-xs px-2.5 py-0.5 rounded-md font-bold">
                        {t('sectionPrefix')} {book.alphabetical_section}
                      </span>
                    </div>

                    {/* Book Title */}
                    <h3 className="text-lg font-bold font-arabic-title text-slate-900 leading-snug group-hover:text-library-800 transition">
                      {book.title}
                    </h3>

                    {/* Author */}
                    <p className="text-xs text-slate-600 flex items-center gap-1.5">
                      <i className="fa-solid fa-feather text-slate-400"></i>
                      <span>{t('authorPrefix')} <strong className="text-slate-800">{book.author}</strong></span>
                    </p>

                    {/* Metadata Grid */}
                    <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl font-mono">
                      <div><span className="text-slate-400 font-sans">{t('serialPrefix')}</span> {book.serial_number}</div>
                      <div><span className="text-slate-400 font-sans">{t('sourcePagePrefix')}</span> {book.source_page}</div>
                    </div>
                  </div>

                  {/* Card Footer */}
                  <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                    <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-bold">
                      {book.category || '⁄«„'}
                    </span>
                    <button
                      onClick={() => onSelectDetail(book)}
                      className="text-xs font-bold text-library-800 hover:text-library-950 flex items-center gap-1.5"
                    >
                      <span>{t('viewDetails')}</span>
                      <i className="fa-solid fa-arrow-right ltr:rotate-0 rtl:rotate-180 text-[10px]"></i>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // ADMIN DASHBOARD COMPONENT
    // =========================================================================
    function AdminDashboard({ books, onOpenImport, onOpenAdd, onEditBook, onDeleteBook, onResetDatabase, t }) {
      const [adminSearch, setAdminSearch] = useState('');
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 10;

      const totalCopiesSum = useMemo(() => {
        return books.reduce((acc, b) => acc + (parseInt(b.available_copies) || 0), 0);
      }, [books]);

      const filtered = useMemo(() => {
        return books.filter(b => 
          (b.title && b.title.toLowerCase().includes(adminSearch.toLowerCase())) ||
          (b.author && b.author.toLowerCase().includes(adminSearch.toLowerCase())) ||
          (b.catalogue_number && b.catalogue_number.toLowerCase().includes(adminSearch.toLowerCase()))
        );
      }, [books, adminSearch]);

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      const paginated = useMemo(() => {
        const start = (currentPage - 1) * itemsPerPage;
        return filtered.slice(start, start + itemsPerPage);
      }, [filtered, currentPage]);

      return (
        <div className="space-y-6">
          
          {/* KEY METRICS CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-500 font-bold">{t('metricTotalBooks')}</p>
                <h4 className="text-2xl font-bold text-slate-900 mt-1">{books.length}</h4>
              </div>
              <div className="w-12 h-12 rounded-xl bg-library-100 text-library-800 flex items-center justify-center text-xl">
                <i className="fa-solid fa-books"></i>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-500 font-bold">{t('metricTotalCopies')}</p>
                <h4 className="text-2xl font-bold text-slate-900 mt-1">{totalCopiesSum}</h4>
              </div>
              <div className="w-12 h-12 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center text-xl">
                <i className="fa-solid fa-copy"></i>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-500 font-bold">{t('metricCategoriesCount')}</p>
                <h4 className="text-2xl font-bold text-slate-900 mt-1">
                  {new Set(books.map(b => b.category)).size}
                </h4>
              </div>
              <div className="w-12 h-12 rounded-xl bg-blue-100 text-blue-800 flex items-center justify-center text-xl">
                <i className="fa-solid fa-layer-group"></i>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-500 font-bold">{t('metricSectionsCount')}</p>
                <h4 className="text-2xl font-bold text-slate-900 mt-1">
                  {new Set(books.map(b => b.alphabetical_section)).size}
                </h4>
              </div>
              <div className="w-12 h-12 rounded-xl bg-purple-100 text-purple-800 flex items-center justify-center text-xl">
                <i className="fa-solid fa-table-cells"></i>
              </div>
            </div>
          </div>

          {/* ACTION TOOLBAR WITH PROMINENT BULK IMPORT BUTTON */}
          <div className="bg-gradient-to-r from-library-950 via-slate-900 to-library-950 rounded-2xl p-5 text-white shadow-lg border border-library-800 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div className="space-y-1 text-center ltr:md:text-left rtl:md:text-right">
              <h3 className="text-lg font-bold text-gold-300">{t('adminHeaderTitle')}</h3>
              <p className="text-xs text-library-100">{t('adminHeaderSubtitle')}</p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              
              {/* === BULK IMPORT BUTTON === */}
              <button
                onClick={onOpenImport}
                id="admin-import-books-btn"
                className="bg-library-700 hover:bg-library-600 text-white font-bold px-5 py-3 rounded-xl shadow-lg flex items-center gap-2.5 transition transform hover:-translate-y-0.5 border border-library-500 text-xs sm:text-sm ring-2 ring-library-400/30"
              >
                <i className="fa-solid fa-file-excel text-lg text-gold-300"></i>
                <span>{t('bulkImportBtn')}</span>
              </button>

              {/* Add Single Book */}
              <button
                onClick={onOpenAdd}
                className="bg-gold-500 hover:bg-gold-400 text-library-950 font-bold px-4 py-3 rounded-xl shadow-md transition flex items-center gap-2 text-xs sm:text-sm"
              >
                <i className="fa-solid fa-plus"></i>
                <span>{t('addBookBtn')}</span>
              </button>

              {/* Reset Database */}
              <button
                onClick={onResetDatabase}
                title={t('resetDbBtnTooltip')}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 p-3 rounded-xl transition text-xs border border-slate-700"
              >
                <i className="fa-solid fa-rotate"></i>
              </button>
            </div>
          </div>

          {/* DATA TABLE CONTAINER */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            
            <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-50">
              <div className="relative w-full sm:w-80">
                <i className="fa-solid fa-magnifying-glass absolute ltr:left-3 rtl:right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder={t('tableSearchPlaceholder')}
                  value={adminSearch}
                  onChange={(e) => { setAdminSearch(e.target.value); setCurrentPage(1); }}
                  className="w-full ltr:pl-9 ltr:pr-3 rtl:pr-9 rtl:pl-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gold-500"
                />
              </div>

              <div className="text-xs text-slate-600">
                {t('recordsShown')} <strong>{paginated.length}</strong> {t('outOfLabel')} {filtered.length}
              </div>
            </div>

            {/* Table */}
            <div className="overflow-x-auto">
              <table className="w-full text-xs ltr:text-left rtl:text-right">
                <thead className="bg-slate-800 text-white font-bold border-b border-slate-700">
                  <tr>
                    <th className="p-3.5">{t('colCatNo')}</th>
                    <th className="p-3.5">{t('colTitle')}</th>
                    <th className="p-3.5">{t('colAuthor')}</th>
                    <th className="p-3.5">{t('colSerialNo')}</th>
                    <th className="p-3.5">{t('colSection')}</th>
                    <th className="p-3.5">{t('colCategory')}</th>
                    <th className="p-3.5">{t('colSourcePage')}</th>
                    <th className="p-3.5 text-center">{t('colActions')}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {paginated.length === 0 ? (
                    <tr>
                      <td colSpan="8" className="p-8 text-center text-slate-400">
                        {t('noBooksFound')}
                      </td>
                    </tr>
                  ) : (
                    paginated.map(b => (
                      <tr key={b.id} className="hover:bg-slate-50 transition">
                        <td className="p-3.5 font-mono font-bold text-library-900">{b.catalogue_number}</td>
                        <td className="p-3.5 font-bold font-arabic-title text-slate-900 text-sm">{b.title}</td>
                        <td className="p-3.5 text-slate-700">{b.author}</td>
                        <td className="p-3.5 font-mono text-slate-500">{b.serial_number}</td>
                        <td className="p-3.5">
                          <span className="bg-amber-50 text-amber-900 px-2.5 py-0.5 rounded border border-amber-200 font-bold">
                            {b.alphabetical_section}
                          </span>
                        </td>
                        <td className="p-3.5 text-slate-600">{b.category || '⁄«„'}</td>
                        <td className="p-3.5 text-slate-600 font-mono">{b.source_page}</td>
                        <td className="p-3.5 text-center space-x-1.5 rtl:space-x-reverse">
                          <button
                            onClick={() => onEditBook(b)}
                            className="bg-blue-50 text-blue-700 hover:bg-blue-100 p-1.5 rounded-md transition"
                            title={t('editTooltip')}
                          >
                            <i className="fa-solid fa-pen-to-square"></i>
                          </button>
                          <button
                            onClick={() => onDeleteBook(b.id)}
                            className="bg-red-50 text-red-700 hover:bg-red-100 p-1.5 rounded-md transition"
                            title={t('deleteTooltip')}
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>

            {/* Pagination */}
            {totalPages > 1 && (
              <div className="p-4 border-t border-slate-200 flex items-center justify-between text-xs bg-slate-50">
                <button
                  onClick={() => setCurrentPage(p => Math.max(p - 1, 1))}
                  disabled={currentPage === 1}
                  className="px-3.5 py-1.5 rounded bg-white border border-slate-300 text-slate-700 disabled:opacity-40 font-bold"
                >
                  {t('prevPage')}
                </button>
                <span className="text-slate-600">
                  {t('pageLabel')} <strong>{currentPage}</strong> {t('outOfLabel')} <strong>{totalPages}</strong>
                </span>
                <button
                  onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))}
                  disabled={currentPage === totalPages}
                  className="px-3.5 py-1.5 rounded bg-white border border-slate-300 text-slate-700 disabled:opacity-40 font-bold"
                >
                  {t('nextPage')}
                </button>
              </div>
            )}

          </div>

        </div>
      );
    }

    // =========================================================================
    // BULK BOOK IMPORTER COMPONENT
    // =========================================================================
    function BulkBookImporter({ existingBooks, onSaveImportedBooks, onClose, t, lang }) {
      const [parsedRows, setParsedRows] = useState([]);
      const [fileName, setFileName] = useState('');
      const [filterMode, setFilterMode] = useState('ALL'); // 'ALL' | 'VALID' | 'ERRORS'
      const [importSummary, setImportSummary] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      const existingCatNumbers = useMemo(() => {
        return new Set(existingBooks.map(b => String(b.catalogue_number || '').trim().toLowerCase()));
      }, [existingBooks]);

      const mapRawRowToBookSchema = (rawRow) => {
        const rowKeys = Object.keys(rawRow);
        const mapped = {};

        Object.keys(HEADER_MAP).forEach(standardKey => {
          const matchedKey = rowKeys.find(rk => 
            HEADER_MAP[standardKey].includes(String(rk).trim().toLowerCase())
          );
          mapped[standardKey] = matchedKey ? String(rawRow[matchedKey]).trim() : '';
        });

        return mapped;
      };

      const validateItem = (item, index, allItems) => {
        const catNum = String(item.catalogue_number || '').trim();
        const title = String(item.title || '').trim();

        let isDuplicateDB = false;
        let isDuplicateFile = false;
        let warning = '';

        if (!title) {
          warning = t('errMissingTitle');
        } else if (!catNum) {
          warning = t('errMissingCat');
        } else if (existingCatNumbers.has(catNum.toLowerCase())) {
          isDuplicateDB = true;
          warning = t('errDupDb');
        } else {
          const firstIdx = allItems.findIndex(x => String(x.catalogue_number || '').trim().toLowerCase() === catNum.toLowerCase());
          if (firstIdx !== -1 && firstIdx < index) {
            isDuplicateFile = true;
            warning = t('errDupFile');
          }
        }

        const isValid = Boolean(title && catNum && !isDuplicateDB && !isDuplicateFile);

        return {
          ...item,
          isValid,
          isDuplicateDB,
          isDuplicateFile,
          warningMessage: warning
        };
      };

      const processFile = (file) => {
        if (!file) return;
        setFileName(file.name);

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rawRows = window.XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!rawRows || rawRows.length === 0) {
              alert(lang === 'ur' ? '„‰ Œ» ›«∆· „Ìü „⁄·Ê„«  ‰¿Ìü ¿Ìü?' : 'The selected file is empty.');
              return;
            }

            const rawMapped = rawRows.map(mapRawRowToBookSchema);

            const validated = rawMapped.map((item, idx, array) => ({
              tempId: `row_${Date.now()}_${idx}`,
              ...validateItem(item, idx, array)
            }));

            setParsedRows(validated);
            setImportSummary(null);
          } catch (err) {
            console.error('File parsing error:', err);
            alert(lang === 'ur' ? '›«∆· Åö™‰ˇ „Ìü Œÿ« ÅÌ‘ ¬∆Ì ¿ˇ?' : 'Error parsing file.');
          }
        };

        reader.readAsArrayBuffer(file);
      };

      const handleCellEdit = (index, field, newValue) => {
        const copy = [...parsedRows];
        copy[index][field] = newValue;

        const revalidated = copy.map((item, idx, arr) => validateItem(item, idx, arr));
        setParsedRows(revalidated);
      };

      const handleRemoveRow = (index) => {
        const copy = parsedRows.filter((_, i) => i !== index);
        const revalidated = copy.map((item, idx, arr) => validateItem(item, idx, arr));
        setParsedRows(revalidated);
      };

      const handleExecuteImport = () => {
        const validRecords = parsedRows.filter(r => r.isValid);
        const failedCount = parsedRows.length - validRecords.length;

        if (validRecords.length === 0) {
          alert(lang === 'ur' ? 'œ—¬„œ òˇ ·Ìˇ òÊ∆Ì œ—”  ò «» „ÊÃÊœ ‰¿Ìü ¿ˇ?' : 'No valid records to import.');
          return;
        }

        const cleanToSave = validRecords.map(({ tempId, isValid, isDuplicateDB, isDuplicateFile, warningMessage, ...rest }) => rest);

        onSaveImportedBooks(cleanToSave);

        setImportSummary({
          successCount: validRecords.length,
          skippedCount: failedCount
        });
        setParsedRows([]);
      };

      const handleDownloadSample = () => {
        const sampleData = [
          {
            "Title": "”‰‰ «·œ«—„Ì",
            "Author": "«·≈„«„ ⁄»œ «··Â »‰ ⁄»œ «·—Õ„‰ «·œ«—„Ì",
            "Serial Number": "SN-2024-051",
            "Catalogue Number": "UQL-1051",
            "Alphabetical Section": "”",
            "Source Page": "’ 50",
            "Category": "ÕœÌÀ ‘—Ì›",
            "Total Copies": 5,
            "Available Copies": 4
          },
          {
            "Title": "„‘ﬂ«… «·„’«»ÌÕ",
            "Author": "«·ŒÿÌ» «· »—Ì“Ì",
            "Serial Number": "SN-2024-052",
            "Catalogue Number": "UQL-1052",
            "Alphabetical Section": "„",
            "Source Page": "’ 120",
            "Category": "ÕœÌÀ ‘—Ì›",
            "Total Copies": 6,
            "Available Copies": 5
          },
          {
            "Title": "⁄ﬁÌœ¿ ÿÕ«ÊÌ¿ («—œÊ ‘—Õ)",
            "Author": "„Ê·«‰« ⁄»œ«·—Õ„‰ ’«Õ»",
            "Serial Number": "SN-2024-053",
            "Catalogue Number": "UQL-1053",
            "Alphabetical Section": "⁄",
            "Source Page": "’ 85",
            "Category": "⁄·„ «·⁄ﬁÌœ¿",
            "Total Copies": 4,
            "Available Copies": 3
          }
        ];

        const ws = window.XLSX.utils.json_to_sheet(sampleData);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "SampleBooks");
        window.XLSX.writeFile(wb, "«ı„¯ «·ﬁ—Ì? ·«∆»—Ì—Ì - ò «»Êü òÌ ›¿—” .xlsx");
      };

      const visibleRows = useMemo(() => {
        if (filterMode === 'VALID') return parsedRows.filter(r => r.isValid);
        if (filterMode === 'ERRORS') return parsedRows.filter(r => !r.isValid);
        return parsedRows;
      }, [parsedRows, filterMode]);

      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
          <div className="bg-white rounded-2xl w-full max-w-6xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">
            
            {/* Header */}
            <div className="bg-gradient-to-r from-library-950 to-slate-900 text-white p-5 flex items-center justify-between border-b border-gold-500/30">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-library-700 flex items-center justify-center text-xl text-gold-300 shadow">
                  <i className="fa-solid fa-file-excel"></i>
                </div>
                <div>
                  <h3 className="text-lg font-bold text-gold-300">
                    {t('bulkModalTitle')}
                  </h3>
                  <p className="text-xs text-library-100">{t('bulkModalSubtitle')}</p>
                </div>
              </div>

              <button
                onClick={onClose}
                className="text-slate-400 hover:text-white p-2 text-lg transition"
              >
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            {/* Body */}
            <div className="p-6 overflow-y-auto space-y-6 flex-1">
              
              {/* Dropzone */}
              <div
                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                onDragLeave={() => setIsDragging(false)}
                onDrop={(e) => {
                  e.preventDefault();
                  setIsDragging(false);
                  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    processFile(e.dataTransfer.files[0]);
                  }
                }}
                className={`border-2 border-dashed rounded-2xl p-6 text-center transition ${
                  isDragging ? 'border-gold-500 bg-gold-50/50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100/70'
                }`}
              >
                <input
                  type="file"
                  accept=".csv, .xlsx, .xls"
                  onChange={(e) => processFile(e.target.files[0])}
                  id="bulk-file-input"
                  className="hidden"
                />

                <div className="space-y-3">
                  <div className="w-14 h-14 mx-auto rounded-full bg-library-100 text-library-900 flex items-center justify-center text-2xl shadow-inner">
                    <i className="fa-solid fa-cloud-arrow-up"></i>
                  </div>
                  <div>
                    <label
                      htmlFor="bulk-file-input"
                      className="cursor-pointer font-bold text-library-900 hover:text-library-950 underline text-sm"
                    >
                      {t('dropzoneClick')}
                    </label>
                    <span className="text-xs text-slate-500 me-1"> {t('dropzoneOr')}</span>
                  </div>
                  <p className="text-xs text-slate-500">{t('supportedFormats')}</p>

                  <div className="pt-2">
                    <button
                      onClick={handleDownloadSample}
                      type="button"
                      className="inline-flex items-center gap-1.5 text-xs text-gold-950 bg-gold-100 hover:bg-gold-300 px-3.5 py-2 rounded-lg font-bold transition border border-gold-300"
                    >
                      <i className="fa-solid fa-download"></i>
                      <span>{t('downloadSampleBtn')}</span>
                    </button>
                  </div>
                </div>

                {fileName && (
                  <div className="mt-4 inline-flex items-center gap-2 bg-library-50 text-library-900 text-xs px-4 py-1.5 rounded-full border border-library-300 font-bold">
                    <i className="fa-solid fa-file-csv"></i>
                    <span>{t('selectedFileLabel')} {fileName}</span>
                  </div>
                )}
              </div>

              {/* Summary Alert */}
              {importSummary && (
                <div className="bg-library-50 border border-library-300 rounded-xl p-5 text-library-950 space-y-2">
                  <div className="flex items-center gap-2 font-bold text-base">
                    <i className="fa-solid fa-circle-check text-library-800 text-xl"></i>
                    <span>{t('importCompletedTitle')}</span>
                  </div>
                  <div className="text-xs space-y-1 pr-7 font-bold">
                    <p>{t('savedCountLabel')} <strong>{importSummary.successCount}</strong></p>
                    {importSummary.skippedCount > 0 && (
                      <p className="text-amber-800">{t('skippedCountLabel')} <strong>{importSummary.skippedCount}</strong></p>
                    )}
                  </div>
                </div>
              )}

              {/* Preview Table */}
              {parsedRows.length > 0 && (
                <div className="space-y-4">
                  
                  {/* Controls */}
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-100 p-3 rounded-xl border border-slate-200">
                    <div className="flex items-center gap-2 text-xs">
                      <button
                        onClick={() => setFilterMode('ALL')}
                        className={`px-3 py-1 rounded-lg transition font-bold ${
                          filterMode === 'ALL' ? 'bg-slate-800 text-white' : 'bg-white text-slate-700 hover:bg-slate-200'
                        }`}
                      >
                        {t('filterAllRows')} ({parsedRows.length})
                      </button>
                      <button
                        onClick={() => setFilterMode('VALID')}
                        className={`px-3 py-1 rounded-lg transition font-bold ${
                          filterMode === 'VALID' ? 'bg-library-800 text-white' : 'bg-white text-library-800 hover:bg-slate-200'
                        }`}
                      >
                        {t('filterValidRows')} ({parsedRows.filter(r => r.isValid).length})
                      </button>
                      <button
                        onClick={() => setFilterMode('ERRORS')}
                        className={`px-3 py-1 rounded-lg transition font-bold ${
                          filterMode === 'ERRORS' ? 'bg-red-700 text-white' : 'bg-white text-red-700 hover:bg-slate-200'
                        }`}
                      >
                        {t('filterErrorRows')} ({parsedRows.filter(r => !r.isValid).length})
                      </button>
                    </div>

                    <button
                      onClick={handleExecuteImport}
                      className="bg-library-800 hover:bg-library-900 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2"
                    >
                      <i className="fa-solid fa-cloud-arrow-down"></i>
                      <span>{t('saveValidBtn')} ({parsedRows.filter(r => r.isValid).length})</span>
                    </button>
                  </div>

                  {/* Table */}
                  <div className="border border-slate-200 rounded-xl overflow-x-auto max-h-96">
                    <table className="w-full text-xs ltr:text-left rtl:text-right">
                      <thead className="bg-slate-800 text-white sticky top-0 z-10 font-bold">
                        <tr>
                          <th className="p-3">{t('colStatus')}</th>
                          <th className="p-3">{t('colTitle')}</th>
                          <th className="p-3">{t('colAuthor')}</th>
                          <th className="p-3">{t('colSerialNo')}</th>
                          <th className="p-3">{t('colCatNo')}</th>
                          <th className="p-3">{t('colSection')}</th>
                          <th className="p-3">{t('colSourcePage')}</th>
                          <th className="p-3 text-center">{t('colActions')}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 bg-white">
                        {visibleRows.length === 0 ? (
                          <tr>
                            <td colSpan="8" className="p-6 text-center text-slate-400">
                              {t('noRowsInFilter')}
                            </td>
                          </tr>
                        ) : (
                          visibleRows.map((row) => {
                            const realIndex = parsedRows.findIndex(r => r.tempId === row.tempId);
                            return (
                              <tr
                                key={row.tempId}
                                className={
                                  row.isDuplicateDB || row.isDuplicateFile
                                    ? 'bg-red-50/80 hover:bg-red-100/60'
                                    : !row.isValid
                                    ? 'bg-amber-50/80 hover:bg-amber-100/60'
                                    : 'hover:bg-slate-50'
                                }
                              >
                                <td className="p-2 min-w-[170px]">
                                  {row.isValid ? (
                                    <span className="inline-flex items-center gap-1 bg-library-100 text-library-950 font-bold px-2 py-0.5 rounded text-[11px]">
                                      <i className="fa-solid fa-check"></i> {t('statusReady')}
                                    </span>
                                  ) : (
                                    <span className="inline-flex items-center gap-1 bg-red-100 text-red-900 font-bold px-2 py-0.5 rounded text-[11px]" title={row.warningMessage}>
                                      {row.warningMessage}
                                    </span>
                                  )}
                                </td>

                                <td className="p-1.5">
                                  <input
                                    type="text"
                                    value={row.title}
                                    onChange={(e) => handleCellEdit(realIndex, 'title', e.target.value)}
                                    className="w-full p-1.5 border border-slate-300 rounded text-xs font-bold font-arabic-title"
                                  />
                                </td>

                                <td className="p-1.5">
                                  <input
                                    type="text"
                                    value={row.author}
                                    onChange={(e) => handleCellEdit(realIndex, 'author', e.target.value)}
                                    className="w-full p-1.5 border border-slate-300 rounded text-xs"
                                  />
                                </td>

                                <td className="p-1.5">
                                  <input
                                    type="text"
                                    value={row.serial_number}
                                    onChange={(e) => handleCellEdit(realIndex, 'serial_number', e.target.value)}
                                    className="w-full p-1.5 border border-slate-300 rounded text-xs font-mono"
                                  />
                                </td>

                                <td className="p-1.5">
                                  <input
                                    type="text"
                                    value={row.catalogue_number}
                                    onChange={(e) => handleCellEdit(realIndex, 'catalogue_number', e.target.value)}
                                    className={`w-full p-1.5 border rounded text-xs font-mono font-bold ${
                                      row.isDuplicateDB || row.isDuplicateFile ? 'border-red-500 bg-red-50 text-red-900' : 'border-slate-300'
                                    }`}
                                  />
                                </td>

                                <td className="p-1.5 w-20">
                                  <input
                                    type="text"
                                    value={row.alphabetical_section}
                                    onChange={(e) => handleCellEdit(realIndex, 'alphabetical_section', e.target.value)}
                                    className="w-full p-1.5 border border-slate-300 rounded text-xs text-center font-bold"
                                  />
                                </td>

                                <td className="p-1.5 w-24">
                                  <input
                                    type="text"
                                    value={row.source_page}
                                    onChange={(e) => handleCellEdit(realIndex, 'source_page', e.target.value)}
                                    className="w-full p-1.5 border border-slate-300 rounded text-xs text-center"
                                  />
                                </td>

                                <td className="p-1.5 text-center">
                                  <button
                                    onClick={() => handleRemoveRow(realIndex)}
                                    className="text-red-600 hover:text-red-800 p-1 rounded"
                                    title={t('deleteTooltip')}
                                  >
                                    <i className="fa-solid fa-trash-can"></i>
                                  </button>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>

                </div>
              )}

            </div>

            {/* Footer */}
            <div className="bg-slate-100 p-4 border-t border-slate-200 flex justify-between items-center">
              <span className="text-xs text-slate-600">
                {t('bulkHelpFooter')}
              </span>
              <button
                onClick={onClose}
                className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-5 py-2 rounded-lg transition"
              >
                {t('closeBtn')}
              </button>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // ADD / EDIT BOOK MODAL
    // =========================================================================
    function AddEditBookModal({ book, onSave, onClose, t }) {
      const [formData, setFormData] = useState({
        title: book ? book.title : '',
        author: book ? book.author : '',
        serial_number: book ? book.serial_number : 'SN-2024-' + Math.floor(100 + Math.random() * 900),
        catalogue_number: book ? book.catalogue_number : 'UQL-' + Math.floor(1051 + Math.random() * 500),
        alphabetical_section: book ? book.alphabetical_section : '√',
        source_page: book ? book.source_page : '’ 1',
        category: book ? book.category : 'ÕœÌÀ ‘—Ì›',
        total_copies: book ? book.total_copies : 5,
        available_copies: book ? book.available_copies : 5
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.catalogue_number) {
          alert('Title and Catalogue Number are required.');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-slate-200">
            <h3 className="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 font-arabic-title">
              {book ? t('editTitle') : t('addTitle')}
            </h3>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">{t('fieldTitle')}</label>
                <input
                  type="text"
                  required
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-bold text-slate-900 font-arabic-title"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">{t('fieldAuthor')}</label>
                <input
                  type="text"
                  required
                  value={formData.author}
                  onChange={(e) => setFormData({ ...formData, author: e.target.value })}
                  className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldCatNo')}</label>
                  <input
                    type="text"
                    required
                    value={formData.catalogue_number}
                    onChange={(e) => setFormData({ ...formData, catalogue_number: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-mono font-bold text-library-900"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldSerialNo')}</label>
                  <input
                    type="text"
                    value={formData.serial_number}
                    onChange={(e) => setFormData({ ...formData, serial_number: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-mono text-slate-600"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldSection')}</label>
                  <input
                    type="text"
                    value={formData.alphabetical_section}
                    onChange={(e) => setFormData({ ...formData, alphabetical_section: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-center font-bold"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldSourcePage')}</label>
                  <input
                    type="text"
                    value={formData.source_page}
                    onChange={(e) => setFormData({ ...formData, source_page: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-center"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldCategory')}</label>
                  <input
                    type="text"
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldTotalCopies')}</label>
                  <input
                    type="number"
                    min="1"
                    value={formData.total_copies}
                    onChange={(e) => setFormData({ ...formData, total_copies: parseInt(e.target.value) || 1 })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-center font-bold"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">{t('fieldAvailableCopies')}</label>
                  <input
                    type="number"
                    min="0"
                    value={formData.available_copies}
                    onChange={(e) => setFormData({ ...formData, available_copies: parseInt(e.target.value) || 0 })}
                    className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-center font-bold"
                  />
                </div>
              </div>

              <div className="pt-4 flex justify-end gap-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300"
                >
                  {t('cancelBtn')}
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 bg-library-800 text-white font-bold rounded-lg hover:bg-library-900"
                >
                  {t('saveBtn')}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // BOOK DETAIL MODAL
    // =========================================================================
    function BookDetailModal({ book, onClose, t }) {
      return (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-slate-200 space-y-4">
            
            <div className="flex justify-between items-start border-b border-slate-100 pb-3">
              <span className="bg-library-100 text-library-950 font-mono font-bold text-xs px-3 py-1 rounded-md">
                {book.catalogue_number}
              </span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="space-y-3">
              <h2 className="text-2xl font-bold font-arabic-title text-slate-900 leading-snug">
                {book.title}
              </h2>
              <p className="text-sm text-slate-600">
                {t('authorPrefix')} <strong className="text-slate-900">{book.author}</strong>
              </p>

              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 gap-3 text-xs font-mono">
                <div>
                  <span className="text-slate-400 block font-sans">{t('serialPrefix')}</span>
                  <span className="font-bold text-slate-800">{book.serial_number}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-sans">{t('alphabeticalSectionLabel')}</span>
                  <span className="font-bold text-amber-700">{book.alphabetical_section}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-sans">{t('sourcePagePrefix')}</span>
                  <span className="font-bold text-slate-800">{book.source_page}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-sans">{t('subjectLabel')}</span>
                  <span className="font-bold text-slate-800 font-sans">{book.category || '⁄«„'}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-sans">{t('availableCopiesLabel')}</span>
                  <span className="font-bold text-library-800">{book.available_copies}</span>
                </div>
                <div>
                  <span className="text-slate-400 block font-sans">{t('totalCopiesLabel')}</span>
                  <span className="font-bold text-slate-800">{book.total_copies}</span>
                </div>
              </div>
            </div>

            <div className="pt-2 text-right rtl:text-left">
              <button
                onClick={onClose}
                className="bg-slate-800 text-white text-xs font-bold px-5 py-2 rounded-lg hover:bg-slate-900"
              >
                {t('closeBtn')}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
