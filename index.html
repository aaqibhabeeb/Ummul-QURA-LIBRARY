    function deriveSectionLetter(title) {
      const trimmed = String(title || '').trim();
      const first = trimmed.charAt(0);
      if (!first) return 'ا';
      if (['أ', 'إ', 'آ', 'ا'].includes(first)) return 'ا';
      if (['ک', 'ك'].includes(first)) return 'ک';
      if (['ی', 'ي', 'ے'].includes(first)) return 'ی';
      if (['ہ', 'ه', 'ھ'].includes(first)) return 'ہ';
      return first;
    }

      History: 'تاریخ',
      Novels: 'ناول',
      Dictionaries: 'لغت و فرہنگ',
      'General Literature': 'عمومی ادب'
    };

    function normalizeCategoryPair(raw) {
      const val = String(raw || '').trim();
      if (!val) return ['General Literature', 'عمومی ادب'];
      const lower = val.toLowerCase();
      if (lower.includes('tafseer') || lower.includes('tafsir') || val.includes('تفسیر')) return ['Tafseer', 'تفسیر'];
      if (lower.includes('hadith') || lower.includes('hadees') || val.includes('حدیث')) return ['Hadith', 'حدیث'];
      if (lower.includes('fiqh') || lower.includes('fatawa') || val.includes('فقہ') || val.includes('فتاوی')) return ['Fiqh', 'فقہ'];

      if (lower.includes('novel') || lower.includes('fiction') || val.includes('ناول')) return ['Novels', 'ناول'];
      if (lower.includes('dictionar') || lower.includes('lughat') || val.includes('لغت') || val.includes('فرہنگ')) return ['Dictionaries', 'لغت و فرہنگ'];

      {

        descUr: 'کتابیں قوم کی امانت ہیں جن کی مکمل حفاظت، صفائی اور احترام آپ کی اخلاقی ذمہ داری ہے۔ کسی قسم کی تحریر، نشان یا ورق پھاڑنا سختی سے منع ہے۔',
        descEn: "Books are a shared community trust. Keeping them clean, intact, and free of markings or torn pages is every reader's responsibility."
      }
    ];

    function mergeInitialBooks(storedList) {
      if (!Array.isArray(storedList) || storedList.length === 0) {
        return INITIAL_92_BOOKS;
      }
      const existingIds = new Set(storedList.map(b => Number(b.id)));
      const existingCats = new Set(
        storedList.map(b => String(b.catalogueNumber || b.callNumber || '').trim().toLowerCase()).filter(Boolean)
      );
      const additions = INITIAL_92_BOOKS.filter(seed => {
        const cat = String(seed.catalogueNumber || seed.callNumber || '').trim().toLowerCase();
        return !existingIds.has(seed.id) && (!cat || !existingCats.has(cat));
      });
      return [...storedList, ...additions];
    }

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('uql_app_lang') || 'ur');
      const isUrdu = lang === 'ur';
      const t = (key) => DICT[lang][key] || key;

      const [books, setBooks] = useState(() => {
        try {
          const raw = localStorage.getItem('uql_books_db');
          const parsed = raw ? JSON.parse(raw) : [];
          const merged = mergeInitialBooks(parsed);
          localStorage.setItem('uql_books_db', JSON.stringify(merged));
          return merged;
        } catch {
          return INITIAL_92_BOOKS;
        }
      });

      const [issueLogs, setIssueLogs] = useState(() => {
        try {
          const raw = localStorage.getItem('uql_issue_logs_db');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {}
        return INITIAL_ISSUE_LOGS;
      });

      const [activeTab, setActiveTab] = useState('home');
      const [selectedGalleryIdx, setSelectedGalleryIdx] = useState(0);
      const [showGalleryLightbox, setShowGalleryLightbox] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedSection, setSelectedSection] = useState('All');
      const [issueFilter, setIssueFilter] = useState('All');
      const [issueSearch, setIssueSearch] = useState('');
      const [adminSearch, setAdminSearch] = useState('');
      const [adminPage, setAdminPage] = useState(1);

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [pendingBookToEdit, setPendingBookToEdit] = useState(null);

      const [detailBook, setDetailBook] = useState(null);
      const [readerBook, setReaderBook] = useState(null);
      const [issueModalBook, setIssueModalBook] = useState(null);
      const [addEditBook, setAddEditBook] = useState(null);
      const [showImportModal, setShowImportModal] = useState(false);
      const [confirmDeleteBook, setConfirmDeleteBook] = useState(null);
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = isUrdu ? 'rtl' : 'ltr';
        localStorage.setItem('uql_app_lang', lang);
      }, [lang, isUrdu]);

      const persistBooks = (next) => {
        setBooks(next);
        localStorage.setItem('uql_books_db', JSON.stringify(next));
      };

      const persistIssueLogs = (next) => {
        setIssueLogs(next);
        localStorage.setItem('uql_issue_logs_db', JSON.stringify(next));
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      const handleTabSwitch = (tab) => {
        if (tab === 'admin' && !isAdminLoggedIn) {
          setLoginError('');
          setShowLoginModal(true);
          return;
        }
        setActiveTab(tab);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleAdminLogin = (pwd) => {
        const clean = pwd.trim();
        if (clean === 'admin123' || clean === 'admin') {
          setIsAdminLoggedIn(true);
          setShowLoginModal(false);
          setLoginError('');
          if (pendingBookToEdit) {
            setAddEditBook(pendingBookToEdit);
            setPendingBookToEdit(null);
          } else {
            setActiveTab('admin');
          }
          showToast(isUrdu ? 'ایڈمن پینل میں خوش آمدید!' : 'Signed in to Admin Panel!');
        } else {
          setLoginError(t('loginInvalid'));
        }
      };

      const handleLogout = () => {
        setIsAdminLoggedIn(false);
        if (activeTab === 'admin') setActiveTab('home');
        showToast(isUrdu ? 'ایڈمن لاگ آؤٹ مکمل ہو گیا۔' : 'Logged out from Admin Panel.');
      };

      const availableCategories = useMemo(() => {
        const map = new Map();
        books.forEach(b => {
          const en = b.category || 'General Literature';
          const ur = b.categoryUrdu || CATEGORY_PAIRS[en] || en;
          if (!map.has(en)) map.set(en, ur);
        });
        return Array.from(map.entries());
      }, [books]);

      const availableSections = useMemo(() => {
        const set = new Set();
        books.forEach(b => {
          const s = (b.alphabeticalSection || '').trim() || deriveSectionLetter(b.titleUrdu);
          if (s) set.add(s);
        });
        return Array.from(set).sort((a, b) => a.localeCompare(b, 'ur'));
      }, [books]);

      const filteredBooks = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return books.filter(b => {
          const matchCat = selectedCategory === 'All' || b.category === selectedCategory;
          const sec = (b.alphabeticalSection || '').trim() || deriveSectionLetter(b.titleUrdu);
          const matchSec = selectedSection === 'All' || sec === selectedSection;
          const matchQuery = !q || [
            b.titleUrdu, b.titleEnglish, b.authorUrdu, b.authorEnglish,
            b.catalogueNumber, b.serialNumber, b.callNumber, b.shelfLocation
          ].some(v => String(v || '').toLowerCase().includes(q));
          return matchCat && matchSec && matchQuery;
        });
      }, [books, searchQuery, selectedCategory, selectedSection]);

      const filteredLogs = useMemo(() => {
        const q = issueSearch.trim().toLowerCase();
        return issueLogs.filter(log => {
          const matchFilter = issueFilter === 'All' || log.status === issueFilter;
          const matchQ = !q || [log.memberName, log.memberPhone, log.memberCardNo, log.bookTitleUrdu, log.bookTitle]
            .some(v => String(v || '').toLowerCase().includes(q));
          return matchFilter && matchQ;
        });
      }, [issueLogs, issueFilter, issueSearch]);

      const totalAvailableCopies = useMemo(() => books.reduce((s, b) => s + Number(b.availableCopies || 0), 0), [books]);
      const activeBorrowedCount = useMemo(() => issueLogs.filter(l => l.status === 'Issued').length, [issueLogs]);

      const handleIssueBook = (book, form) => {
        const today = new Date();
        const due = new Date(today.getTime() + Number(form.days || 7) * 86400000);
        const fmt = (d) => d.toISOString().slice(0, 10);
        const nextId = issueLogs.reduce((m, l) => Math.max(m, Number(l.id || 0)), 0) + 1;
        const newLog = {
          id: nextId,
          bookId: book.id,
          bookTitle: book.titleEnglish,
          bookTitleUrdu: book.titleUrdu,
          memberName: form.memberName.trim(),
          memberPhone: form.memberPhone.trim(),
          memberCardNo: form.memberCardNo.trim(),
          issueDate: fmt(today),
          dueDate: fmt(due),
          returnDate: null,
          status: 'Issued',
          notes: form.notes.trim()
        };
        persistIssueLogs([newLog, ...issueLogs]);
        const updatedBooks = books.map(b => b.id === book.id ? { ...b, availableCopies: Math.max(0, Number(b.availableCopies || 0) - 1) } : b);
        persistBooks(updatedBooks);
        const refreshed = updatedBooks.find(b => b.id === book.id);
        if (detailBook && detailBook.id === book.id) setDetailBook(refreshed);
        setIssueModalBook(null);
        showToast(isUrdu ? `کتاب '${book.titleUrdu}' جاری کر دی گئی۔` : `Book '${book.titleEnglish}' issued.`);
      };

      const handleReturnBook = (log) => {
        const today = new Date().toISOString().slice(0, 10);
        persistIssueLogs(issueLogs.map(l => l.id === log.id ? { ...l, status: 'Returned', returnDate: today } : l));
        persistBooks(books.map(b => b.id === log.bookId ? { ...b, availableCopies: Math.min(Number(b.totalCopies || 99), Number(b.availableCopies || 0) + 1) } : b));
        showToast(isUrdu ? 'کتاب کی واپسی کامیابی سے درج ہو گئی۔' : 'Book marked as returned.');
      };

      const handleSaveBook = (formBook) => {
        const [catEn, catUr] = normalizeCategoryPair(formBook.category);
        const section = (formBook.alphabeticalSection || '').trim() || deriveSectionLetter(formBook.titleUrdu);
        if (formBook.id) {
          const updated = books.map(b => b.id === formBook.id ? { ...b, ...formBook, category: catEn, categoryUrdu: catUr, alphabeticalSection: section } : b);
          persistBooks(updated);
          if (detailBook && detailBook.id === formBook.id) setDetailBook(updated.find(b => b.id === formBook.id));
          showToast(isUrdu ? 'کتاب کی تفصیلات اپ ڈیٹ ہو گئیں۔' : 'Book details updated.');
        } else {
          const nextId = books.reduce((m, b) => Math.max(m, Number(b.id || 0)), 0) + 1;
          const newBook = {
            ...formBook,
            id: nextId,
            category: catEn,
            categoryUrdu: catUr,
            alphabeticalSection: section,
            callNumber: formBook.callNumber || formBook.catalogueNumber || `UQL-${1000 + nextId}`
          };
          persistBooks([newBook, ...books]);
          showToast(isUrdu ? 'نئی کتاب شامل کر دی گئی۔' : 'New book added to catalogue.');
        }
        setAddEditBook(null);
      };

      const handleDeleteBook = (book) => {
        persistBooks(books.filter(b => b.id !== book.id));
        if (detailBook && detailBook.id === book.id) setDetailBook(null);
        setConfirmDeleteBook(null);
        showToast(isUrdu ? 'کتاب حذف کر دی گئی۔' : 'Book deleted from catalogue.');
      };

      const handleBulkImportSave = (validRows) => {
        let maxId = books.reduce((m, b) => Math.max(m, Number(b.id || 0)), 0);
        const imported = validRows.map(r => {
          maxId += 1;
          const [catEn, catUr] = normalizeCategoryPair(r.category);
          return {
            id: maxId,
            titleUrdu: r.titleUrdu,
            titleEnglish: r.titleEnglish || r.titleUrdu,
            authorUrdu: r.authorUrdu || 'نامعلوم',
            authorEnglish: r.authorEnglish || r.authorUrdu || 'Unknown',
            category: catEn,
            categoryUrdu: r.categoryUrdu || catUr,
            catalogueNumber: r.catalogueNumber,
            serialNumber: r.serialNumber || `SN-IMP-${maxId}`,
            alphabeticalSection: r.alphabeticalSection || deriveSectionLetter(r.titleUrdu),
            sourcePage: r.sourcePage || 'ص 1',
            callNumber: r.callNumber || r.catalogueNumber,
            shelfLocation: r.shelfLocation || 'مرکزی ریک',
            publisher: r.publisher || 'ام القریٰ لائبریری',
            publishedYear: r.publishedYear || '1445ھ',
            totalCopies: Number(r.totalCopies || 1),
            availableCopies: Number(r.availableCopies ?? r.totalCopies ?? 1),
            descriptionUrdu: r.descriptionUrdu || `${r.titleUrdu} — ام القریٰ لائبریری کی فہرست میں شامل کتاب۔`,
            descriptionEnglish: r.descriptionEnglish || `${r.titleEnglish || r.titleUrdu} — Catalogued at Ummul Qura Library.`,
            sampleExcerptUrdu: '',
            pdfUrl: ''
          };
        });
        persistBooks([...imported, ...books]);
        setShowImportModal(false);
        showToast(isUrdu ? `${imported.length} نئی کتب کامیابی سے محفوظ ہو گئیں!` : `Successfully imported ${imported.length} books!`);
      };

      const adminFilteredBooks = useMemo(() => {
        const q = adminSearch.trim().toLowerCase();
        if (!q) return books;
        return books.filter(b => [
          b.titleUrdu, b.titleEnglish, b.authorUrdu, b.authorEnglish,
          b.catalogueNumber, b.serialNumber, b.callNumber, b.category, b.categoryUrdu
        ].some(v => String(v || '').toLowerCase().includes(q)));
      }, [books, adminSearch]);

      const pageSize = 10;
      const totalAdminPages = Math.max(1, Math.ceil(adminFilteredBooks.length / pageSize));
      const safeAdminPage = Math.min(adminPage, totalAdminPages);
      const adminPageBooks = adminFilteredBooks.slice((safeAdminPage - 1) * pageSize, safeAdminPage * pageSize);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 pb-16 md:pb-0">
          {toast && (
            <div className={`fixed bottom-20 md:bottom-6 ${isUrdu ? 'left-4' : 'right-4'} z-50 px-4 py-3 rounded-xl shadow-xl text-white text-sm font-medium flex items-center gap-2 animate-fadeIn ${toast.type === 'error' ? 'bg-red-600' : 'bg-library-900 border border-gold-500/40'}`}>
              <i className={`fas ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check text-gold-400'}`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          <header className="sticky top-0 z-30 bg-library-900 text-white shadow-md border-b-2 border-gold-500">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => handleTabSwitch('home')}>
                <img
                  src={ASSET_BASE + 'img_ummul_qura_logo.jpg'}
                  alt="Ummul Qura Library Logo"
                  className="w-11 h-11 rounded-full object-cover border-2 border-gold-400 bg-white"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div>
                  <h1 className="font-bold text-lg md:text-xl leading-tight">{t('libraryName')}</h1>
                  <p className="text-xs text-gold-300">{t('librarySub')}</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1.5">
                {[
                  { id: 'home', icon: 'fa-house', label: t('navHome') },
                  { id: 'catalog', icon: 'fa-book-open', label: t('navCatalog') },
                  { id: 'issue_log', icon: 'fa-clipboard-list', label: t('navIssueLog') },
                  { id: 'guidelines', icon: 'fa-scale-balanced', label: t('navGuidelines') },
                  { id: 'admin', icon: isAdminLoggedIn ? 'fa-unlock' : 'fa-lock', label: t('navAdmin') }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => handleTabSwitch(item.id)}
                    className={`px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition ${activeTab === item.id ? 'bg-gold-500 text-library-950 shadow' : 'text-white/90 hover:bg-white/10'}`}
                  >

                    <span>{item.label}</span>

              <div className="flex items-center gap-2">

                  >
                    <i className="fas fa-right-from-bracket"></i>
                    <span className="hidden sm:inline">{t('logoutBtn')}</span>
                  </button>
                )}
                <button
                  onClick={() => setLang(isUrdu ? 'en' : 'ur')}
                  className="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 border border-gold-400/50 text-xs font-bold text-gold-200 transition"
                >
                  <i className="fas fa-language mx-1"></i>
                  {t('langSwitch')}

              </div>
            </div>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {activeTab === 'home' && (
              <div className="space-y-6 animate-fadeIn">
                <section className="relative rounded-2xl overflow-hidden shadow-lg min-h-[300px] flex items-center justify-center text-center text-white">
                  <img
                    src={ASSET_BASE + 'img_library_exterior_real.png'}
                    alt="Ummul Qura Library Exterior"
                    className="absolute inset-0 w-full h-full object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-b from-library-950/75 via-library-900/85 to-library-950/95"></div>
                  <div className="relative z-10 p-6 md:p-10 max-w-2xl mx-auto flex flex-col items-center">
                    <img
                      src={ASSET_BASE + 'img_ummul_qura_logo.jpg'}
                      alt="Logo"
                      className="w-20 h-20 rounded-full object-cover border-2 border-gold-400 bg-white shadow-md mb-3"
                      onError={(e) => { e.target.style.display = 'none'; }}
                    />
                    <span className="inline-block px-3 py-1 rounded-full bg-gold-500/20 border border-gold-400 text-gold-300 text-xs font-bold mb-3">
                      {t('heroBadge')}
                    </span>
                    <h2 className="font-urdu-title text-3xl md:text-4xl font-bold mb-1">ام القریٰ لائبریری</h2>
                    <p className="text-gold-300 tracking-widest font-semibold text-sm md:text-base mb-2">UMMUL QURA LIBRARY</p>
                    <p className="text-white/90 text-sm mb-5">{t('addressFull')}</p>
                    <button
                      onClick={() => handleTabSwitch('catalog')}

                    >
                      <i className="fas fa-book-open"></i>
                      <span>{t('exploreCatalog')}</span>
                    </button>
                  </div>
                </section>

                <section className="grid grid-cols-3 gap-3 md:gap-4">
                  <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-100 text-center">
                    <i className="fas fa-book text-gold-500 text-xl mb-1"></i>
                    <div className="font-bold text-slate-900 text-sm md:text-base">{books.length} {t('booksUnit')}</div>
                    <div className="text-xs text-slate-500">{t('collectionStat')}</div>
                  </div>

                    <i className="fas fa-clock text-library-800 text-xl mb-1"></i>

                    <div className="text-xs text-library-700">{t('statusStat')}</div>
                  </div>
                  <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-100 text-center">
                    <i className="fas fa-location-dot text-gold-500 text-xl mb-1"></i>

                <section className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-10 h-10 rounded-full bg-library-100 text-library-800 flex items-center justify-center">
                        <i className="fas fa-map-location-dot"></i>
                      </div>
                      <h3 className="font-bold text-lg text-library-900">{t('addressTitle')}</h3>
                    </div>
                    <p className="text-slate-700 leading-relaxed text-sm md:text-base">{t('addressFull')}</p>

                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-10 h-10 rounded-full bg-library-100 text-library-800 flex items-center justify-center">
                        <i className="fas fa-clock"></i>
                      </div>

                    </div>

                      <div className="flex justify-between gap-2 border-b border-slate-100 pb-1.5">
                        <span className="font-semibold text-slate-700">{t('monSat')}</span>

                      </div>

                <section className="grid md:grid-cols-2 gap-4">
                  <div className="bg-library-100/60 rounded-2xl p-5 border border-library-700/15">
                    <h3 className="font-bold text-lg text-library-900 mb-2">{t('aboutTitle')}</h3>
                    <p className="text-library-950/90 text-sm leading-7">{t('aboutBody')}</p>

                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-3">

    function ReaderModal({ book, isUrdu, onClose }) {

        `فصل اول: تعارف و اہمیت\n\n${book.descriptionEnglish}\n\nعلم دین کی طلب ہر مسلمان پر فرض ہے۔ ام القریٰ لائبریری کا مقصد طلبہ، علماء اور قارئین تک مستند علمی و ادبی ذخیرہ پہنچانا ہے۔`,
        `فصل دوم: منتخب اقتباس\n\n${book.sampleExcerptUrdu || book.descriptionUrdu}`
      ];

      return (
        <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
          <div className={`rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl ${night ? 'bg-zinc-900 text-zinc-100' : 'bg-amber-50/95 text-slate-900'}`}>
            <div className="bg-library-900 text-white px-4 py-3 flex items-center justify-between">
              <div>
                <div className="font-bold text-sm">{isUrdu ? book.titleUrdu : book.titleEnglish}</div>
                <div className="text-[11px] text-gold-300">{isUrdu ? `صفحہ ${page} / ${pages.length}` : `Page ${page} / ${pages.length}`}</div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setNight(n => !n)} className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25"><i className="fas fa-moon"></i></button>
                <button onClick={() => setFontSize(s => Math.min(26, s + 2))} className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25"><i className="fas fa-magnifying-glass-plus"></i></button>
                <button onClick={() => setFontSize(s => Math.max(13, s - 2))} className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25"><i className="fas fa-magnifying-glass-minus"></i></button>
                <button onClick={onClose} className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25"><i className="fas fa-xmark"></i></button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-6 whitespace-pre-line leading-loose" style={{ fontSize: `${fontSize}px` }}>
              {pages[page - 1]}
            </div>
            <div className="px-4 py-3 border-t border-black/10 flex items-center justify-between">
              <button disabled={page <= 1} onClick={() => setPage(p => p - 1)} className="px-4 py-1.5 rounded-lg bg-library-900 text-white disabled:opacity-40 text-xs font-bold">

                {isUrdu ? 'اگلا صفحہ' : 'Next'}
              </button>

        </div>
      );

    function IssueBookModal({ book, isUrdu, onClose, onConfirm }) {
      const [memberName, setMemberName] = useState('');
      const [memberPhone, setMemberPhone] = useState('');
      const [memberCardNo, setMemberCardNo] = useState('');
      const [days, setDays] = useState(7);
      const [notes, setNotes] = useState('');
      const [error, setError] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!memberName.trim() || !memberPhone.trim()) {
          setError(isUrdu ? 'برائے مہربانی ممبر کا نام اور فون نمبر درج کریں۔' : 'Please enter member name and phone number.');
          return;
        }
        onConfirm({ memberName, memberPhone, memberCardNo, days, notes });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
          <form onSubmit={submit} className="bg-white rounded-2xl max-w-md w-full p-6 space-y-3 shadow-2xl">
            <h3 className="font-bold text-lg text-library-900">{isUrdu ? 'کتاب جاری کریں' : 'Issue Book to Member'}</h3>
            <p className="text-xs text-slate-500">{isUrdu ? book.titleUrdu : book.titleEnglish}</p>
            {error && <div className="text-xs text-red-600 bg-red-50 p-2 rounded-lg">{error}</div>}
            <input required value={memberName} onChange={e => setMemberName(e.target.value)} placeholder={isUrdu ? 'ممبر کا نام *' : 'Member Name *'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            <input required value={memberPhone} onChange={e => setMemberPhone(e.target.value)} placeholder={isUrdu ? 'فون نمبر *' : 'Phone Number *'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            <div className="grid grid-cols-2 gap-2">
              <input value={memberCardNo} onChange={e => setMemberCardNo(e.target.value)} placeholder={isUrdu ? 'کارڈ نمبر' : 'Card No.'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              <input type="number" min="1" max="30" value={days} onChange={e => setDays(e.target.value)} placeholder={isUrdu ? 'مدت (دن)' : 'Days'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            </div>
            <input value={notes} onChange={e => setNotes(e.target.value)} placeholder={isUrdu ? 'نوٹس (اختیاری)' : 'Notes (optional)'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
            <div className="flex gap-2 justify-end pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">{isUrdu ? 'منسوخ' : 'Cancel'}</button>
              <button type="submit" className="px-4 py-2 rounded-xl bg-library-900 text-white text-xs font-bold">{isUrdu ? 'جاری کریں' : 'Confirm Issue'}</button>
            </div>
          </form>
        </div>
      );
    }

                onChange={e => setPwd(e.target.value)}
                placeholder={t('passwordPlaceholder')}
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-library-700"
                autoFocus
              />
              <button type="button" onClick={() => setShow(s => !s)} className="absolute top-2.5 end-3 text-slate-400">
                <i className={`fas ${show ? 'fa-eye-slash' : 'fa-eye'}`}></i>
              </button>
            </div>
            <div className="flex gap-2 justify-end">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">{t('cancelBtn')}</button>
              <button type="submit" className="px-5 py-2 rounded-xl bg-library-900 text-white text-xs font-bold">{t('loginBtn')}</button>
            </div>
          </form>
        </div>
      );
    }

    function AddEditBookModal({ book, isUrdu, onClose, onSave }) {
      const [form, setForm] = useState({ ...book });
      const upd = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

      const submit = (e) => {
        e.preventDefault();
        if (!form.titleUrdu?.trim() && !form.titleEnglish?.trim()) return;
        onSave({
          ...form,
          titleUrdu: form.titleUrdu?.trim() || form.titleEnglish?.trim(),
          titleEnglish: form.titleEnglish?.trim() || form.titleUrdu?.trim(),
          totalCopies: Math.max(1, Number(form.totalCopies || 1)),
          availableCopies: Math.min(Math.max(0, Number(form.availableCopies ?? form.totalCopies ?? 1)), Math.max(1, Number(form.totalCopies || 1)))
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
          <form onSubmit={submit} className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 className="font-bold text-lg text-library-900">
              {form.id ? (isUrdu ? 'کتاب میں ترمیم کریں' : 'Edit Book') : (isUrdu ? 'نئی کتاب شامل کریں' : 'Add New Book')}
            </h3>
            <div className="grid sm:grid-cols-2 gap-3 text-sm">
              <input required value={form.titleUrdu || ''} onChange={e => upd('titleUrdu', e.target.value)} placeholder={isUrdu ? 'اردو عنوان *' : 'Urdu Title *'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.titleEnglish || ''} onChange={e => upd('titleEnglish', e.target.value)} placeholder={isUrdu ? 'انگریزی عنوان' : 'English Title'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.authorUrdu || ''} onChange={e => upd('authorUrdu', e.target.value)} placeholder={isUrdu ? 'مصنف (اردو)' : 'Author (Urdu)'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.authorEnglish || ''} onChange={e => upd('authorEnglish', e.target.value)} placeholder={isUrdu ? 'مصنف (انگریزی)' : 'Author (English)'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <select value={form.category || 'General Literature'} onChange={e => upd('category', e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200">
                {Object.keys(CATEGORY_PAIRS).map(c => <option key={c} value={c}>{isUrdu ? `${CATEGORY_PAIRS[c]} (${c})` : c}</option>)}
              </select>
              <input value={form.catalogueNumber || ''} onChange={e => upd('catalogueNumber', e.target.value)} placeholder={isUrdu ? 'فہرست نمبر (مثلاً UQL-1051)' : 'Catalogue Number'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.serialNumber || ''} onChange={e => upd('serialNumber', e.target.value)} placeholder={isUrdu ? 'سلسلہ نمبر' : 'Serial Number'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.alphabeticalSection || ''} onChange={e => upd('alphabeticalSection', e.target.value)} placeholder={isUrdu ? 'الفبائی شعبہ (مثلاً ا)' : 'Alphabetical Section'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.sourcePage || ''} onChange={e => upd('sourcePage', e.target.value)} placeholder={isUrdu ? 'ماخذ صفحہ' : 'Source Page'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.shelfLocation || ''} onChange={e => upd('shelfLocation', e.target.value)} placeholder={isUrdu ? 'شیلف مقام' : 'Shelf Location'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.publisher || ''} onChange={e => upd('publisher', e.target.value)} placeholder={isUrdu ? 'ناشر' : 'Publisher'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input value={form.publishedYear || ''} onChange={e => upd('publishedYear', e.target.value)} placeholder={isUrdu ? 'سال اشاعت' : 'Published Year'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input type="number" min="1" value={form.totalCopies ?? 1} onChange={e => upd('totalCopies', e.target.value)} placeholder={isUrdu ? 'کل کاپیاں' : 'Total Copies'} className="px-3 py-2 rounded-xl border border-slate-200" />
              <input type="number" min="0" value={form.availableCopies ?? 1} onChange={e => upd('availableCopies', e.target.value)} placeholder={isUrdu ? 'دستیاب کاپیاں' : 'Available Copies'} className="px-3 py-2 rounded-xl border border-slate-200" />
            </div>
            <textarea rows="2" value={form.descriptionUrdu || ''} onChange={e => upd('descriptionUrdu', e.target.value)} placeholder={isUrdu ? 'اردو تعارف' : 'Urdu Description'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
            <textarea rows="2" value={form.descriptionEnglish || ''} onChange={e => upd('descriptionEnglish', e.target.value)} placeholder={isUrdu ? 'انگریزی تعارف' : 'English Description'} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm"></textarea>
            <div className="flex gap-2 justify-end pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">{isUrdu ? 'منسوخ' : 'Cancel'}</button>
              <button type="submit" className="px-5 py-2 rounded-xl bg-library-900 text-white text-xs font-bold">{isUrdu ? 'محفوظ کریں' : 'Save Book'}</button>
            </div>
          </form>
        </div>
      );
    }

    function BulkImportModal({ existingBooks, isUrdu, onClose, onSave }) {
      const [rows, setRows] = useState([]);
      const [filterMode, setFilterMode] = useState('all');

      const mapHeader = (raw) => {
        const clean = String(raw || '').trim().toLowerCase();
        for (const [field, aliases] of Object.entries(HEADER_MAP)) {
          if (aliases.some(a => clean === a || clean.includes(a))) return field;
        }
        return null;
      };

      const revalidate = (list) => {
        const dbCats = new Set(existingBooks.map(b => String(b.catalogueNumber || b.callNumber || '').trim().toLowerCase()).filter(Boolean));
        const seen = new Set();
        return list.map(r => {
          const title = String(r.titleUrdu || r.titleEnglish || '').trim();
          const catNo = String(r.catalogueNumber || '').trim();
          let err = '';
          if (!title) err = isUrdu ? 'عنوان کتاب غائب ہے' : 'Missing title';
          else if (!catNo) err = isUrdu ? 'فہرست نمبر غائب ہے' : 'Missing catalogue number';
          else if (dbCats.has(catNo.toLowerCase())) err = isUrdu ? 'فہرست نمبر پہلے سے موجود ہے' : 'Duplicate in database';
          else if (seen.has(catNo.toLowerCase())) err = isUrdu ? 'فائل میں دہرا فہرست نمبر' : 'Duplicate in file';
          if (catNo) seen.add(catNo.toLowerCase());
          return { ...r, error: err };
        });
      };

      const handleFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          if (aoa.length < 2) return;
          const headers = aoa[0].map(mapHeader);
          const parsed = aoa.slice(1).filter(r => r.some(c => String(c).trim())).map((r, i) => {
            const obj = { _rowKey: i + 1, titleUrdu: '', titleEnglish: '', authorUrdu: '', category: 'General Literature', catalogueNumber: '', serialNumber: '', alphabeticalSection: '', shelfLocation: 'مرکزی ریک', totalCopies: 1 };
            r.forEach((cell, cIdx) => {
              const key = headers[cIdx];
              if (key) obj[key] = String(cell).trim();
            });
            if (!obj.titleUrdu && obj.titleEnglish) obj.titleUrdu = obj.titleEnglish;
            return obj;
          });
          setRows(revalidate(parsed));
        };
        reader.readAsArrayBuffer(file);
      };

      const downloadTemplate = () => {
        const ws = XLSX.utils.aoa_to_sheet([
          ['titleUrdu', 'titleEnglish', 'authorUrdu', 'category', 'catalogueNumber', 'serialNumber', 'alphabeticalSection', 'shelfLocation', 'totalCopies'],
          ['حجۃ اللہ البالغہ', 'Hujjatullah al-Baligha', 'شاہ ولی اللہ محدث دہلوی', 'Fiqh', 'UQL-1099', 'SN-2024-099', 'ح', 'شعبہ فقہ - ریک C-21', 3]
        ]);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Books');
        XLSX.writeFile(wb, 'ummul_qura_sample_import.xlsx');
      };

      const validRows = rows.filter(r => !r.error);
      const errorRows = rows.filter(r => r.error);
      const visible = filterMode === 'ready' ? validRows : filterMode === 'errors' ? errorRows : rows;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-4xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] flex flex-col">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-lg text-library-900">{isUrdu ? 'بلک CSV / Excel کتب امپورٹ' : 'Bulk CSV / Excel Book Import'}</h3>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100"><i className="fas fa-xmark"></i></button>
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <label className="px-4 py-2 rounded-xl bg-library-900 text-white text-xs font-bold cursor-pointer">
                <i className="fas fa-upload mx-1"></i> {isUrdu ? 'فائل منتخب کریں (.xlsx / .csv)' : 'Select File (.xlsx / .csv)'}
                <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="hidden" />
              </label>
              <button onClick={downloadTemplate} className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">
                <i className="fas fa-download mx-1"></i> {isUrdu ? 'نمونہ Excel ڈاؤن لوڈ کریں' : 'Download Sample .xlsx'}
              </button>
            </div>
            {rows.length > 0 && (
              <>
                <div className="flex gap-2 text-xs">
                  <button onClick={() => setFilterMode('all')} className={`px-3 py-1 rounded-full font-bold ${filterMode === 'all' ? 'bg-library-900 text-white' : 'bg-slate-100'}`}>All ({rows.length})</button>
                  <button onClick={() => setFilterMode('ready')} className={`px-3 py-1 rounded-full font-bold ${filterMode === 'ready' ? 'bg-emerald-700 text-white' : 'bg-emerald-50 text-emerald-700'}`}>Ready ({validRows.length})</button>
                  <button onClick={() => setFilterMode('errors')} className={`px-3 py-1 rounded-full font-bold ${filterMode === 'errors' ? 'bg-red-700 text-white' : 'bg-red-50 text-red-700'}`}>Errors ({errorRows.length})</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 border border-slate-100 rounded-xl p-2">
                  {visible.map(r => (
                    <div key={r._rowKey} className={`p-3 rounded-xl border text-xs grid sm:grid-cols-4 gap-2 ${r.error ? 'bg-red-50/70 border-red-200' : 'bg-emerald-50/40 border-emerald-200'}`}>
                      <input value={r.titleUrdu} onChange={e => setRows(prev => revalidate(prev.map(x => x._rowKey === r._rowKey ? { ...x, titleUrdu: e.target.value } : x)))} placeholder="Title" className="px-2 py-1 rounded border bg-white" />
                      <input value={r.authorUrdu} onChange={e => setRows(prev => revalidate(prev.map(x => x._rowKey === r._rowKey ? { ...x, authorUrdu: e.target.value } : x)))} placeholder="Author" className="px-2 py-1 rounded border bg-white" />
                      <input value={r.catalogueNumber} onChange={e => setRows(prev => revalidate(prev.map(x => x._rowKey === r._rowKey ? { ...x, catalogueNumber: e.target.value } : x)))} placeholder="Catalogue No" className="px-2 py-1 rounded border bg-white" />
                      <div className={`flex items-center font-bold ${r.error ? 'text-red-700' : 'text-emerald-700'}`}>{r.error || (isUrdu ? 'تیار' : 'Ready')}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">{isUrdu ? 'بند کریں' : 'Close'}</button>
              <button disabled={validRows.length === 0} onClick={() => onSave(validRows)} className="px-5 py-2 rounded-xl bg-library-900 text-white disabled:opacity-40 text-xs font-bold">
                {isUrdu ? `${validRows.length} کتب محفوظ کریں` : `Save ${validRows.length} Valid Books`}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
